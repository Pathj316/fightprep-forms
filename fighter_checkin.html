<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Min träning</title>
<style>
:root{color-scheme:dark;--bg:#050a07;--surface:#0b1710;--text:#e9f4ec;--muted:#8fae9b;--border:#1b3326;--accent:#1f9d5c;--accent-text:#ffffff;--ok:#34d399;--danger:#f97316;--chip:#10201a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.45rem;line-height:1.2;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 0 14px}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:650;padding:0;margin:0 0 8px;width:100%}
.hint{display:block;font-weight:400;color:var(--muted);font-size:.86rem;margin-top:2px}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.pick{position:relative;display:block}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pick span{display:flex;align-items:center;justify-content:center;min-height:48px;padding:6px 8px;text-align:center;
  border:1px solid var(--border);border-radius:11px;background:var(--surface);font-weight:600}
.pick input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.pick input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-top:6px}
input[type=date],input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
label.f{display:block;font-weight:650;margin:0 0 6px}
.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:700;
  min-height:52px;padding:0 18px;width:100%;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--text);border:1px solid var(--border);font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-weight:600;margin:0 0 12px}
.center{text-align:center}
.big{font-size:2.4rem;margin:0}
.muted{color:var(--muted)}
.stack>*+*{margin-top:10px}
[hidden]{display:none!important}
select,input[type=number]{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-height:48px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.nav button{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;min-height:46px;font:inherit;font-weight:650;cursor:pointer}
.nav button[aria-current=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;background:var(--chip);border:1px solid var(--border);border-radius:99px;padding:2px 10px;font-size:.84rem;margin:0 4px 4px 0}
.ok{color:var(--ok);font-weight:650}
.sm{min-height:40px;width:auto;padding:0 14px;font-size:.92rem}
.txt{margin:6px 0 0;white-space:pre-wrap}
h2{font-size:1.1rem;margin:0 0 8px}


/* VZ */
.vz-card{background:var(--surface,#fff);border:1px solid var(--border,#d5dbe3);border-left:4px solid var(--border,#d5dbe3);border-radius:12px;padding:14px;margin:0 0 12px}
.vz-card.good{border-left-color:#1f9d6b}.vz-card.work{border-left-color:#d99a06}.vz-card.warn{border-left-color:#f97316}.vz-card.info{border-left-color:#60a5fa}
.vz-card h3{margin:0 0 8px;font-size:1.02rem}
.vz-card p{margin:0 0 8px}
.vz-h{margin:4px 0 10px;font-size:1.25rem}
.vz-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 6px}
.vz-tile{background:var(--surface,#fff);border:1px solid var(--border,#d5dbe3);border-radius:12px;padding:10px 12px}
.vz-l{font-size:.82rem;color:var(--muted,#586272)}
.vz-v{font-size:1.5rem;font-weight:700;line-height:1.2}.vz-v small{font-size:.8rem;font-weight:500;color:var(--muted,#586272)}
.vz-d{font-size:.78rem;color:var(--muted,#586272)}
.vz-note{font-size:.82rem;color:var(--muted,#586272);margin:6px 0 10px}
.vz-svg{width:100%;height:auto;display:block}
.vz-grid{stroke:var(--border,#d5dbe3);stroke-width:1}
.vz-ax{fill:var(--muted,#586272);font-size:9px}
.vz-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 4px}
.vz-key{font-size:.8rem;display:inline-flex;align-items:center;gap:5px}.vz-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.vz-line{margin:0 0 10px}.vz-lh{display:flex;justify-content:space-between;font-size:.9rem}.vz-lh span{color:var(--muted,#586272)}
.vz-hb{display:grid;gap:6px}.vz-hr{display:grid;grid-template-columns:88px 1fr 44px;gap:8px;align-items:center;font-size:.9rem}
.vz-hbar{background:var(--chip,#eef1f5);border-radius:6px;height:12px;overflow:hidden}.vz-hbar i{display:block;height:100%}
.vz-pl{display:grid;gap:6px}.vz-pr{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;align-items:center;font-size:.88rem;padding:6px 0;border-top:1px solid var(--border,#d5dbe3)}
.vz-pd{font-weight:600}.vz-rpe{grid-column:1/3;background:var(--chip,#eef1f5);border-radius:6px;height:8px;overflow:hidden;display:block}.vz-rpe i{display:block;height:100%;background:var(--accent,#1f9d5c)}.vz-pm{grid-column:1/3;color:var(--muted,#586272);font-size:.8rem}
.vz-tag{display:inline-block;border:1px solid;border-radius:99px;padding:0 8px;font-size:.78rem;margin:0 4px 2px 0}
.vz-it{padding:8px 0 8px 10px;border-left:3px solid var(--border,#d5dbe3);margin:0 0 8px}.vz-it.good{border-left-color:#1f9d6b}.vz-it.work{border-left-color:#d99a06}.vz-it.warn{border-left-color:#f97316}.vz-it.info{border-left-color:#60a5fa}
.vz-why{font-size:.86rem;color:var(--muted,#586272);margin-top:2px}
.vz-chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:700;color:#fff;background:#60a5fa;margin:0 0 6px}.vz-chip.good{background:#1f9d6b}.vz-chip.warn{background:#f97316}.vz-chip.work{background:#d99a06}
.vz-sc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 8px}
.vz-t{border-collapse:collapse;width:100%;font-size:.86rem}.vz-t th,.vz-t td{border-bottom:1px solid var(--border,#d5dbe3);padding:6px 8px;text-align:left;vertical-align:top}
.vz-team th[scope=row]{position:sticky;left:0;background:var(--surface,#fff);white-space:nowrap;z-index:1}
.vz-c{white-space:nowrap}.vz-c.ok{background:rgba(31,157,107,.16)}.vz-c.mid{background:rgba(217,154,6,.22)}.vz-c.bad{background:rgba(249,115,22,.24)}.vz-c.info{background:rgba(74,123,224,.16)}.vz-c.na{color:var(--muted,#586272)}
.vz-s{font-weight:700}
.vz-sw{padding:1px 6px;border-radius:6px}.vz-sw.ok{background:rgba(31,157,107,.16)}.vz-sw.mid{background:rgba(217,154,6,.22)}.vz-sw.bad{background:rgba(249,115,22,.24)}
.vz-legacy{line-height:1.5}

.vz-card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.vz-card>summary::-webkit-details-marker{display:none}
.vz-card>summary::after,.vz-sub>summary::after{content:'▾';color:var(--muted,#586272);transition:transform .15s}
.vz-card:not([open])>summary::after,.vz-sub:not([open])>summary::after{transform:rotate(-90deg)}
.vz-card>summary h3{margin:0}
.vz-body{margin-top:10px}
.vz-sub{border-top:1px solid var(--border,#d5dbe3);padding:8px 0}
.vz-sub>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;min-height:30px;align-items:center}
.vz-sub>summary::-webkit-details-marker{display:none}
.vz-sub .vz-body{margin-top:6px}
.vz-sub.work{border-left:3px solid #d99a06;padding-left:8px}
.vz-tg{margin:0 0 10px;text-align:right}
.vz-btn{background:transparent;border:1px solid var(--border,#d5dbe3);color:inherit;border-radius:8px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;min-height:36px}
.vz-card p+p{margin-top:8px}
/* ===== Dashboard ===== */
#dash{position:fixed;inset:0;z-index:9999;background:#000;--bg:#050a07;--surface:#0b1710;--text:#e9f4ec;--muted:#77957f;--border:#1b3326;--chip:#10201a;--ok:#34d399;--danger:#f97316;--accent:#1f9d5c;color:#e9f4ec;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#dash *{box-sizing:border-box}
#dash button{font:inherit;color:inherit;cursor:pointer}
#dash .dapp{position:absolute;left:0;top:0;width:1366px;height:768px;transform-origin:0 0;background:#050a07;display:grid;grid-template-rows:auto auto 1fr;min-height:0}
#dash .dhdr{display:flex;align-items:center;gap:16px;padding:9px 20px;background:#08110c;border-bottom:1px solid #1b3326}
#dash .dlogo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
#dash .dlogo i{width:24px;height:24px;border-radius:7px;background:#1f9d5c;display:grid;place-items:center;font-style:normal;font-size:15px;color:#fff}
#dash .dchip{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 5px;border-radius:99px;background:#0b1710;border:1px solid #1b3326}
#dash .dav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1f9d5c,#0f6b3a);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
#dash .dchip b{display:block;font-size:15px;line-height:1.1}#dash .dchip small{font-size:13px;color:#77957f}
#dash .dinfo{font-size:13px;color:#a9c4b4;max-width:360px;line-height:1.3}
#dash .drng{margin-left:auto;display:flex;background:#0b1710;border:1px solid #1b3326;border-radius:10px;padding:3px}
#dash .drng button{background:none;border:0;padding:5px 13px;border-radius:7px;color:#a9c4b4;font-weight:600;font-size:14px}
#dash .drng button.on{background:#1f9d5c;color:#fff}
#dash .dx{background:#0b1710;border:1px solid #1b3326;border-radius:10px;padding:7px 14px;font-weight:600;color:#e9f4ec}
#dash .dtabs{display:flex;gap:2px;padding:0 14px;background:#08110c;border-bottom:1px solid #1b3326;overflow-x:auto}
#dash .dtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px;color:#a9c4b4;font-weight:600;font-size:15px;white-space:nowrap}
#dash .dtabs button.on{color:#fff;border-bottom-color:#1f9d5c}
#dash main{min-height:0;position:relative;max-width:none;margin:0;padding:0;width:auto}
#dash .dload{padding:30px;color:#a9c4b4}
#dash .panel{position:absolute;inset:0;padding:14px 20px;display:none;min-height:0;gap:12px}
#dash .panel.on{display:grid}
#dash .dcard{background:#0b1710;border:1px solid #1b3326;border-radius:14px;padding:12px 16px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#dash .dcard h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:#77957f;font-weight:700}
#dash .sub{font-size:13px;color:#77957f;margin:2px 0 6px}
#dash .chart{flex:1;min-height:0;position:relative;overflow:hidden}
#dash .chart svg{display:block}
#dash svg text{font-family:inherit;fill:#77957f;font-size:12.5px}
#dash .dnd{height:100%;display:grid;place-items:center;color:#77957f;font-size:14px;text-align:center;padding:8px}
#dash .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#a9c4b4;margin-top:6px}
#dash .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#dash .mut{color:#77957f;font-size:13.5px}
#dash .fn{font-size:12.5px;color:#77957f;margin:6px 0 0}
#dash .chip{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:rgba(34,164,93,.18);color:#7fe0a8}
#dash .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
#dash .kpi{background:#0b1710;border:1px solid #1b3326;border-radius:14px;padding:10px 14px;min-width:0}
#dash .kpi .l{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:#77957f;font-weight:700}
#dash .kpi .v{font-size:27px;font-weight:800;line-height:1.15}#dash .kpi .v small{font-size:14px;font-weight:600;color:#a9c4b4}
#dash .kpi .d{font-size:12.5px;color:#a9c4b4;min-height:18px}
#dash .up{color:#fbbf24}#dash .dn{color:#7fe0a8}#dash .flat{color:#77957f}
#dash #p-overview{grid-template-rows:auto 1fr 170px}
#dash #p-overview .mid{display:grid;grid-template-columns:1.9fr 1fr;gap:12px;min-height:0}
#dash #p-overview .bot{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-height:0}
#dash .ai{display:flex;flex-direction:column;gap:8px;overflow:auto}
#dash .ai p{margin:0;font-size:15px;line-height:1.5;color:#e9f4ec}
#dash .link{color:#7fe0a8;background:none;border:0;padding:0;font-weight:600;text-align:left}
#dash #p-training{grid-template-columns:1fr 2.2fr;grid-template-rows:1fr 1fr}
#dash #p-training .t1{grid-row:1/3;display:flex;flex-direction:column;min-height:0}#dash #p-training .t1>.dcard,#dash #p-training .t2>.dcard{flex:1}
#dash #p-training .t2{display:flex;min-height:0}#dash #p-training .t2>.dcard{width:100%}
#dash #p-training .rt{grid-column:2;display:grid;grid-template-columns:1.5fr 1fr;gap:12px;min-height:0}
#dash .nl{overflow:auto;flex:1;min-height:0}
#dash .nt{border-top:1px solid #1b3326;padding:7px 0;font-size:14px;color:#a9c4b4}#dash .nt:first-child{border-top:0}
#dash .nt b{color:#e9f4ec}
#dash .dh{display:flex;flex-direction:column;gap:12px;padding-top:6px}
#dash .dhr{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;font-size:14px}
#dash .dhl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
#dash .dhb{background:#10201a;border-radius:6px;height:14px;overflow:hidden;display:block}#dash .dhb b{display:block;height:100%;border-radius:6px}
#dash .dhv{color:#a9c4b4;font-size:13px;text-align:right}
#dash #p-body{grid-template-columns:1fr 1fr 300px;grid-template-rows:1fr 1fr}
#dash #p-body .tbl{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;min-height:0}#dash #p-body .tbl>.dcard{flex:1}
#dash #p-weight{grid-template-columns:2.1fr 1fr;grid-template-rows:auto 1fr}
#dash #p-weight .wk{grid-column:1;grid-row:1/3;display:flex;min-height:0}#dash #p-weight .wk>.dcard{width:100%}
#dash #p-weight>div{min-height:0;display:flex}#dash #p-weight>div>.dcard{width:100%}
#dash .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#dash .stat{background:#10201a;border:1px solid #1b3326;border-radius:10px;padding:8px 11px}
#dash .stat b{display:block;font-size:20px}#dash .stat span{font-size:13px;color:#77957f}
#dash #p-analysis{grid-template-columns:360px 1fr}
#dash #p-analysis>div{min-height:0;display:flex}#dash #p-analysis>div>.dcard{width:100%}
#dash .list,#dash .det{overflow:auto;flex:1;min-height:0;margin-top:6px}
#dash .list .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid #1b3326;border-radius:11px;margin-bottom:8px;background:#10201a;text-align:left;width:100%}
#dash .list .it.on{border-color:#1f9d5c;background:#10301f}
#dash .list .n{flex:none;width:22px;height:22px;border-radius:7px;background:#1b3326;display:grid;place-items:center;font-size:13px;font-weight:800}
#dash .list .t{flex:1;font-weight:600;font-size:14px}#dash .list small{color:#77957f;font-weight:400}
#dash #p-layers{display:block;overflow:auto}
#dash .lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
#dash .lg .card{background:#0b1710;border:1px solid #1b3326;border-radius:14px;padding:12px 16px;margin:0}
#dash #p-profile{grid-template-columns:320px 1fr}
#dash #p-profile>div:first-child{min-height:0;display:flex}#dash #p-profile>div:first-child>.dcard{width:100%;overflow:auto}
#dash .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#dash .facts div{background:#10201a;border:1px solid #1b3326;border-radius:10px;padding:8px 10px;min-width:0}
#dash .facts span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#77957f}#dash .facts b{font-size:16px;overflow-wrap:anywhere}
#dash .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;overflow:auto;min-height:0}
#dash .ptxt{margin:8px 0 0;font-size:15.5px;line-height:1.55;color:#a9c4b4;white-space:pre-wrap}
/* lagrens och analysens återanvända kort, mörkt */
#dash .vz-card,#dash .vz-it{color:#e9f4ec}
/* mobil: samma layout, staplad */
#dash.mob{overflow:auto;-webkit-overflow-scrolling:touch}
#dash.mob .dapp{position:relative;width:100%!important;height:auto!important;min-height:100%;display:block}
#dash.mob .dhdr{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;position:sticky;top:0;z-index:3}
#dash.mob .dinfo{order:5;flex-basis:100%;max-width:none}
#dash.mob .drng{margin-left:0}#dash.mob .dx{margin-left:auto}
#dash.mob .dtabs{position:sticky;top:0;z-index:2}
#dash.mob main{position:static}
#dash.mob .panel{position:static;padding:12px;display:none!important;grid-template-columns:1fr!important;grid-template-rows:none!important}
#dash.mob .panel.on{display:grid!important}
#dash.mob .kpis{grid-template-columns:1fr 1fr}
#dash.mob .kpi .v{font-size:24px}
#dash.mob #p-overview .mid,#dash.mob #p-overview .bot,#dash.mob #p-training .rt{grid-template-columns:1fr}
#dash.mob #p-training .rt,#dash.mob #p-body .tbl,#dash.mob #p-training .t1{grid-column:auto;grid-row:auto}
#dash.mob .chart{flex:none;height:210px}
#dash.mob .dcard>h3{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:2px 0}
#dash.mob .dcard>h3:after{content:'▾';font-size:15px;color:#a9c4b4}
#dash.mob .dcard.cl>h3:after{content:'▸'}
#dash.mob .dcard.cl>*:not(h3){display:none}
#dash.mob .dcard.cl{padding-bottom:10px}
#dash.mob .nl,#dash.mob .list,#dash.mob .det{max-height:360px}
#dash.mob #p-profile>div:first-child>.dcard{overflow:visible}
#dash.mob .pgrid,#dash.mob .lg{grid-template-columns:1fr}
#dash.mob .dhr{grid-template-columns:90px 1fr 100px}
#dash.mob #p-layers{overflow:visible}
.fold>:first-child h3,.fold>h3:first-child{cursor:pointer}.fold>:first-child h3:after,.fold>h3:first-child:after{content:' ▾';color:var(--muted)}.fold.cl>:first-child h3:after,.fold.cl>h3:first-child:after{content:' ▸'}.fold.cl>*:not(:first-child){display:none}

/* ===== Samma stil som coach-appen och artefakten ===== */
header.top{display:flex;align-items:center;gap:9px;padding:10px 20px;background:#08110c;border-bottom:1px solid var(--border);font-weight:800;font-size:19px;letter-spacing:-.02em}
.lm{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:15px;color:#fff}
main{max-width:640px}
.nav{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:0 0 18px;overflow-x:auto}
.nav button{border:0;border-bottom:3px solid transparent;background:none;border-radius:0;color:#a9c4b4;padding:11px 14px;min-height:0;font-size:15px;font-weight:600;white-space:nowrap;flex:1}

      '<div class="card"><fieldset><legend>Hur tungt var passet?<span class="hint">1 = mycket lätt, 5 = jobbigt men jämnt, 8 = mycket tungt, 10 = maximalt</span></legend>' + scale('prpe', 1, 10, 'g5', p.rpe) + '</fieldset></div>' +
      '<div class="card"><fieldset><legend>Hur länge höll du på?<span class="hint">Minuter</span></legend><div class="grid g5" style="grid-template-columns:repeat(3,1fr)">' + MINS.map(function (m) {
        return '<label class="pick"><input type="radio" name="pmin" value="' + m + '"' + (chip && mins === m ? ' checked' : '') + '><span>' + m + '</span></label>'; }).join('') + '</div>' +
      '<label class="f" for="pmc" style="margin-top:10px">Annan tid (min)</label><input type="number" id="pmc" inputmode="numeric" min="1" max="600" value="' + (!chip && mins ? esc(mins) : '') + '"></fieldset></div>' +
      '<div class="card"><fieldset><legend>Har du någon värk eller smärta efter passet?</legend><div class="grid g2"><label class="pick"><input type="radio" name="ppain" value="no"' + (edit && !p.pain ? ' checked' : '') + '><span>Nej</span></label><label class="pick"><input type="radio" name="ppain" value="yes"' + (p.pain ? ' checked' : '') + '><span>Ja</span></label></div>' +
      '<div id="ppw" ' + (p.pain ? '' : 'hidden ') + 'style="margin-top:10px"><label class="f" for="ppl">Var och hur illa?</label><input type="text" id="ppl" maxlength="200" value="' + esc(p.pain_location || '') + '"></div></fieldset></div>' +
      '<div class="card"><label class="f" for="pdid">Vad gjorde du?</label><span class="hint" style="margin-bottom:6px">Till exempel: knäböj 5x5 och marklyft, eller 5 ronder sparring, eller löpning 6 km. Skriv fritt.</span><textarea id="pdid" maxlength="1500">' + esc(p.did || '') + '</textarea></div>' +
      '<div class="card"><label class="f" for="pfelt">Hur kändes det?</label><span class="hint" style="margin-bottom:6px">Vad funkade, vad var svårt, vad vill du jobba på. Skriv fritt.</span><textarea id="pfelt" maxlength="1500">' + esc(p.felt || '') + '</textarea></div>' +
      '<p id="perr" hidden role="alert"></p><div class="stack"><button class="btn" type="submit">' + (edit ? 'Spara ändringar' : 'Spara pass') + '</button><button class="btn sec" type="button" id="pcancel">Avbryt</button></div></form>');
    var f = $('pform');
    f.addEventListener('change', function (e) { if (e.target && e.target.name === 'ppain') $('ppw').hidden = e.target.value !== 'yes'; if (e.target && e.target.name === 'pmin') $('pmc').value = ''; });
    $('pmc').addEventListener('input', function () { Array.prototype.forEach.call(document.querySelectorAll('input[name=pmin]'), function (r) { r.checked = false; }); });
    $('pcancel').onclick = function () { render(); };
    f.onsubmit = function (e) {
      e.preventDefault();
      var er = $('perr'), sel = [];
      Array.prototype.forEach.call(document.querySelectorAll('input[name=ptype]:checked'), function (c) { sel.push(c.value); });
      var rpe = val('prpe'), pain = val('ppain'), m = numv('pmc'); if (m == null) { var cm = val('pmin'); m = cm ? +cm : null; }
      if (!sel.length) { say(er, 'Välj minst en passtyp.'); return; }
      if (!rpe) { say(er, 'Ange hur tungt passet var.'); return; }
      if (!m || m < 1 || m > 600) { say(er, 'Ange hur länge passet var.'); return; }
      if (!pain) { say(er, 'Svara om du har någon värk.'); return; }
      var btn = f.querySelector('button[type=submit]'); btn.disabled = true;
      rpc('fp5_submit_pass', { p_token: token, p_id: edit ? p.id : null, p_date: $('pdate').value, p_types: sel, p_rpe: +rpe, p_minutes: Math.round(m), p_pain: pain === 'yes', p_pain_location: pain === 'yes' ? $('ppl').value : null, p_did: $('pdid').value, p_felt: $('pfelt').value })
        .then(function (r) { if (!r || !r.ok) { btn.disabled = false; say(er, errMsg(r)); return; } tab = 'today'; return load(); })
        .catch(function () { btn.disabled = false; say(er, 'Det gick inte att spara. Försök igen.'); });
    };
  }

  /* ---------- MINA PASS ---------- */
  function renderMine() {
    var h = '<div class="card"><h2>Mina pass, senaste 4 veckorna</h2>' + (ctx.passes.length ? ctx.passes.map(passItem).join('') : '<p class="sub" style="margin:0">Inga pass än.</p>') + '<p class="hint" style="margin-top:10px">Du kan ändra pass som är högst 14 dagar gamla.</p></div>' +
      '<div class="card"><h2>Morgonkoll</h2>' + (ctx.daily.length ? ctx.daily.map(function (d) {
        return '<div style="border-top:1px solid var(--border);padding:8px 0"><b>' + esc(d.day) + '</b><div class="sub" style="margin:2px 0 0">Sömn ' + esc(d.sleep) + '/5' + (d.sleep_hours != null ? ' (' + esc(d.sleep_hours) + ' h)' : '') + ' · Energi ' + esc(d.energy) + '/5 · Ömhet ' + esc(d.soreness) + '/5 · Stress ' + esc(d.stress) + '/5' + (d.weight_kg != null ? ' · ' + esc(d.weight_kg) + ' kg' : '') + (d.pain ? ' · Värk: ' + esc(d.pain_location || 'ja') : '') + '</div></div>'; }).join('') : '<p class="sub" style="margin:0">Ingen morgonkoll än.</p>') + '</div>';
    shell(h); bindPassItems();
  }

  /* ---------- ANALYS ---------- */
  function wfetch(mode) {
    return post('/functions/v1/fighter_weekly', { token: token, mode: mode }).catch(function (e) { throw e; });
  }
  var HOWCARD = '<div class="card"><details><summary><h2 style="display:inline">Så läser FightPrep din data</h2></summary>' +
    '<p class="sub" style="margin:10px 0">Det du loggar jämförs mot några saker. Här är vad, och hur säkert det är.</p>' +
    [['1. Dig själv', 'Din senaste vecka jämförs med dina egna tidigare veckor. Det är den viktigaste jämförelsen, eftersom den bara gäller dig.'],
     ['2. Din profil', 'Ålder, bakgrund, stil och erfarenhet som din tränare har lagt in. De används för att sätta det du loggar i sitt sammanhang.'],
     ['3. Din viktklass', 'För din viktklass finns statistik från UFC Performance Institute om hur långa matcher brukar vara och hur ofta de avgörs före domslut. Den gäller elitfighters i UFC 2002–2017, inte amatörer. Använd den som bakgrund, inte som facit för dig.'],
     ['4. Träningsbelastning', 'Hur mycket du tränat den senaste veckan mot veckorna innan, utifrån minuter och hur hårt det kändes. Det är en grov indikator. Forskarna är oense om var gränserna går, så den läses tillsammans med hur du sover, hur öm du är och hur du mår.'],
     ['5. Återhämtning', 'Sömn, energi, ömhet och stress jämförs med vad som är normalt för dig.'],
     ['6. Vikt', 'Om en match är inlagd visas din vikt mot matchens viktgräns. Det är en referens, inte ett råd. Frågor om vikt tar du med din tränare.']
    ].map(function (x) { return '<div style="border-top:1px solid var(--border);padding:8px 0"><b>' + x[0] + '</b><div class="sub" style="margin:2px 0 0">' + x[1] + '</div></div>'; }).join('') +
    '<p class="sub" style="margin:10px 0 0"><b>Viktigt:</b> Det här är stöd för samtalet med din tränare, inte en bedömning av dig. Underlaget är litet för vissa jämförelser, och systemet säger det när det är så.</p></details></div>';

  function renderWeek() {
    shell('<div class="card" id="wk"><p class="sub" style="margin:0">Laddar…</p></div><div class="card"><h2>Tidigare analyser</h2>' + (ctx.analyses.length ? ctx.analyses.map(function (a) { return '<div data-wk="' + esc(a.week_start) + '">' + VZ.hist('Vecka från ' + a.week_start, a.summary, false) + '</div>'; }).join('') : '<p class="sub" style="margin:0">Inga än.</p>') + '</div>' + HOWCARD);
    var box = $('wk');
    function draw(j) {
      if (j.summary) { var dup = document.querySelector('[data-wk="' + j.week_start + '"]'); if (dup) dup.remove(); box.innerHTML = '<h2>Din veckoanalys</h2><p class="sub" style="margin:0 0 10px">' + esc(j.week_start) + ' till ' + esc(j.week_end) + '</p><div class="txt">' + VZ.render(j.summary) + '</div>'; return; }
      box.innerHTML = '<h2>Din veckoanalys</h2><p class="sub" style="margin:0 0 12px">Få en analys av din vecka (' + esc(j.week_start) + ' till ' + esc(j.week_end) + '). Den bygger på det du fyllt i. Du kan göra en per vecka, från söndag kl 20.</p><button class="btn" type="button" id="wgo">Skapa min veckoanalys</button><p class="err" id="werr" hidden></p>';
      $('wgo').onclick = function () {
        var b = this; b.disabled = true; b.textContent = 'Skriver…';
        wfetch('make').then(function (r) { draw(r); return rpc('fp5_context', { p_token: token }).then(function (c) { if (c && c.ok) ctx = c; }); }).catch(function (e) {
          b.disabled = false; b.textContent = 'Skapa min veckoanalys';
          say($('werr'), e.code === 'ingen_data' ? 'Du har inga pass den här veckan än.' : 'Det gick inte nu. Försök igen om en stund.');
        });
      };
    }
    wfetch('get').then(draw).catch(function () { box.innerHTML = '<p class="sub" style="margin:0">Veckoanalysen är inte tillgänglig just nu.</p>'; });
  }

  if (!token) { showInvalid(); } else { load(); }
}());
</script>
</body>
</html>
