<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Min träning</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--text:#14181f;--muted:#586272;--border:#d5dbe3;
  --accent:#c8102e;--accent-text:#ffffff;--ok:#167a43;--danger:#b42318;--chip:#eef1f5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1115;--surface:#171c23;--text:#eef1f5;--muted:#9aa5b4;--border:#2b3340;
    --accent:#e5384f;--accent-text:#ffffff;--ok:#4cc38a;--danger:#ff8a80;--chip:#212934}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.45rem;line-height:1.2;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 0 14px}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:650;padding:0;margin:0 0 8px;width:100%}
.hint{display:block;font-weight:400;color:var(--muted);font-size:.86rem;margin-top:2px}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.pick{position:relative;display:block}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pick span{display:flex;align-items:center;justify-content:center;min-height:48px;padding:6px 8px;text-align:center;
  border:1px solid var(--border);border-radius:11px;background:var(--surface);font-weight:600}
.pick input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.pick input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-top:6px}
input[type=date],input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
label.f{display:block;font-weight:650;margin:0 0 6px}
.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:700;
  min-height:52px;padding:0 18px;width:100%;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--text);border:1px solid var(--border);font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-weight:600;margin:0 0 12px}
.center{text-align:center}
.big{font-size:2.4rem;margin:0}
.muted{color:var(--muted)}
.stack>*+*{margin-top:10px}
[hidden]{display:none!important}
select,input[type=number]{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-height:48px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.nav button{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:11px;min-height:46px;font:inherit;font-weight:650;cursor:pointer}
.nav button[aria-current=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;background:var(--chip);border:1px solid var(--border);border-radius:99px;padding:2px 10px;font-size:.84rem;margin:0 4px 4px 0}
.ok{color:var(--ok);font-weight:650}
.sm{min-height:40px;width:auto;padding:0 14px;font-size:.92rem}
.txt{margin:6px 0 0;white-space:pre-wrap}
h2{font-size:1.1rem;margin:0 0 8px}


/* VZ */
.vz-card{background:var(--surface,#fff);border:1px solid var(--border,#d5dbe3);border-left:4px solid var(--border,#d5dbe3);border-radius:12px;padding:14px;margin:0 0 12px}
.vz-card.good{border-left-color:#1f9d6b}.vz-card.work{border-left-color:#d99a06}.vz-card.warn{border-left-color:#d63a54}.vz-card.info{border-left-color:#4a7be0}
.vz-card h3{margin:0 0 8px;font-size:1.02rem}
.vz-card p{margin:0 0 8px}
.vz-h{margin:4px 0 10px;font-size:1.25rem}
.vz-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 6px}
.vz-tile{background:var(--surface,#fff);border:1px solid var(--border,#d5dbe3);border-radius:12px;padding:10px 12px}
.vz-l{font-size:.82rem;color:var(--muted,#586272)}
.vz-v{font-size:1.5rem;font-weight:700;line-height:1.2}.vz-v small{font-size:.8rem;font-weight:500;color:var(--muted,#586272)}
.vz-d{font-size:.78rem;color:var(--muted,#586272)}
.vz-note{font-size:.82rem;color:var(--muted,#586272);margin:6px 0 10px}
.vz-svg{width:100%;height:auto;display:block}
.vz-grid{stroke:var(--border,#d5dbe3);stroke-width:1}
.vz-ax{fill:var(--muted,#586272);font-size:9px}
.vz-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 4px}
.vz-key{font-size:.8rem;display:inline-flex;align-items:center;gap:5px}.vz-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.vz-line{margin:0 0 10px}.vz-lh{display:flex;justify-content:space-between;font-size:.9rem}.vz-lh span{color:var(--muted,#586272)}
.vz-hb{display:grid;gap:6px}.vz-hr{display:grid;grid-template-columns:88px 1fr 44px;gap:8px;align-items:center;font-size:.9rem}
.vz-hbar{background:var(--chip,#eef1f5);border-radius:6px;height:12px;overflow:hidden}.vz-hbar i{display:block;height:100%}
.vz-pl{display:grid;gap:6px}.vz-pr{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;align-items:center;font-size:.88rem;padding:6px 0;border-top:1px solid var(--border,#d5dbe3)}
.vz-pd{font-weight:600}.vz-rpe{grid-column:1/3;background:var(--chip,#eef1f5);border-radius:6px;height:8px;overflow:hidden;display:block}.vz-rpe i{display:block;height:100%;background:var(--accent,#c8102e)}.vz-pm{grid-column:1/3;color:var(--muted,#586272);font-size:.8rem}
.vz-tag{display:inline-block;border:1px solid;border-radius:99px;padding:0 8px;font-size:.78rem;margin:0 4px 2px 0}
.vz-it{padding:8px 0 8px 10px;border-left:3px solid var(--border,#d5dbe3);margin:0 0 8px}.vz-it.good{border-left-color:#1f9d6b}.vz-it.work{border-left-color:#d99a06}.vz-it.warn{border-left-color:#d63a54}.vz-it.info{border-left-color:#4a7be0}
.vz-why{font-size:.86rem;color:var(--muted,#586272);margin-top:2px}
.vz-chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:700;color:#fff;background:#4a7be0;margin:0 0 6px}.vz-chip.good{background:#1f9d6b}.vz-chip.warn{background:#d63a54}.vz-chip.work{background:#d99a06}
.vz-sc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 8px}
.vz-t{border-collapse:collapse;width:100%;font-size:.86rem}.vz-t th,.vz-t td{border-bottom:1px solid var(--border,#d5dbe3);padding:6px 8px;text-align:left;vertical-align:top}
.vz-team th[scope=row]{position:sticky;left:0;background:var(--surface,#fff);white-space:nowrap;z-index:1}
.vz-c{white-space:nowrap}.vz-c.ok{background:rgba(31,157,107,.16)}.vz-c.mid{background:rgba(217,154,6,.22)}.vz-c.bad{background:rgba(214,58,84,.24)}.vz-c.info{background:rgba(74,123,224,.16)}.vz-c.na{color:var(--muted,#586272)}
.vz-s{font-weight:700}
.vz-sw{padding:1px 6px;border-radius:6px}.vz-sw.ok{background:rgba(31,157,107,.16)}.vz-sw.mid{background:rgba(217,154,6,.22)}.vz-sw.bad{background:rgba(214,58,84,.24)}
.vz-legacy{line-height:1.5}
</style>
</head>
<body>
<main id="app">
  <p class="muted">Laddar…</p>
</main>
<noscript><main><p>Sidan kräver JavaScript.</p></main></noscript>

<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://rgsbhkqwmilragkiogkr.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnc2Joa3F3bWlscmFna2lvZ2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxOTk3MzQsImV4cCI6MjA4MDc3NTczNH0.cCtGnUwa3ynQNDUIYhhhXT6vT04MeaM1mn3flHgFEEU';
  var TYPES = [['styrka','Styrka'],['kondition','Kondition'],['mma','MMA'],['striking','Striking'],['grappling','Grappling'],['wrestling','Brottning'],['sparring','Sparring'],['annat','Annat']];
  var TNAME = {}; TYPES.forEach(function (t) { TNAME[t[0]] = t[1]; });
  var MINS = [30, 45, 60, 75, 90, 120];
  var ERRORS = {
    ogiltig_lank: 'Länken fungerar inte längre. Be din tränare om en ny.',
    for_gammalt_datum: 'Datumet är för gammalt. Du kan fylla i de senaste 14 dagarna.',
    ogiltigt_varde: 'Något svar är ogiltigt. Kontrollera och försök igen.',
    for_manga: 'För många försök på kort tid. Vänta en stund och försök igen.',
    hittades_inte: 'Passet hittades inte.'
  };
  var app = document.getElementById('app');
  var token = getToken();
  var ctx = null, tab = 'today', weeklyData = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
/* ---- VZ: grafer och analyskort (ingen extern kod) ---- */
var VZ = (function () {
  var TN = { styrka: 'Styrka', kondition: 'Kondition', mma: 'MMA', striking: 'Striking', grappling: 'Grappling', wrestling: 'Brottning', sparring: 'Sparring', annat: 'Annat' };
  var TC = { styrka: '#d99a06', kondition: '#1f9d8f', mma: '#d63a54', striking: '#e0661a', grappling: '#4a7be0', wrestling: '#8a5ad6', sparring: '#c2417f', annat: '#8793a3' };
  var WD = ['sö', 'må', 'ti', 'on', 'to', 'fr', 'lö'];
  function wd(iso) { return WD[new Date(iso + 'T12:00:00').getDay()]; }
  function dm(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
  function num(n) { return n == null ? '–' : String(n); }
  function lite(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
  function tag(t) { return '<span class="vz-tag" style="border-color:' + (TC[t] || '#8793a3') + '">' + esc(TN[t] || t) + '</span>'; }

  function tiles(cur, prev) {
    cur = cur || {}; prev = prev || {};
    function t(label, v, p, unit) {
      var d = '';
      if (p != null && Number(p) > 0 && v != null) {
        var diff = Number(v) - Number(p), pct = Math.round(diff / Number(p) * 100);
        d = '<div class="vz-d">' + (diff > 0 ? '▲' : diff < 0 ? '▼' : '●') + ' ' + (diff > 0 ? '+' : '') + pct + ' % mot förra perioden</div>';
      } else { d = '<div class="vz-d">ingen jämförelse</div>'; }
      return '<div class="vz-tile"><div class="vz-l">' + label + '</div><div class="vz-v">' + num(v) + (v != null && unit ? '<small> ' + unit + '</small>' : '') + '</div>' + d + '</div>';
    }
    return '<div class="vz-tiles">' + t('Pass', cur.sessions, prev.sessions, '') + t('Träningstid', cur.minutes, prev.minutes, 'min') + t('Snitt-RPE', cur.avg_rpe, prev.avg_rpe, '') + t('Belastning', cur.load, prev.load, '') + '</div>' +
      '<p class="vz-note">Belastning = hur tungt (RPE 1–10) × minuter, summerat. Det är ett mått på hur mycket kroppen har jobbat. Jämförelsen gäller föregående period av samma längd.</p>';
  }

  function stackedBars(days) {
    if (!days || !days.length) return '';
    var W = 320, H = 170, L = 30, B = 24, T = 14, n = days.length, bw = Math.max(4, Math.min(34, (W - L - 6) / n - 4));
    var max = 0, used = {}; days.forEach(function (d) { if (d.minutes > max) max = d.minutes; for (var k in d.by_type) used[k] = 1; });
    if (!max) return '<p class="vz-note">Inga pass att visa för perioden.</p>';
    var step = max > 150 ? 60 : 30, top = Math.ceil(max / step) * step, ph = H - B - T, s = '';
    for (var g = 0; g <= top; g += step) { var y = T + ph - g / top * ph; s += '<line x1="' + L + '" x2="' + (W - 4) + '" y1="' + y + '" y2="' + y + '" class="vz-grid"/><text x="' + (L - 4) + '" y="' + (y + 3) + '" class="vz-ax" text-anchor="end">' + g + '</text>'; }
    var slot = (W - L - 6) / n, every = n <= 14 ? 1 : Math.ceil(n / 8);
    days.forEach(function (d, i) {
      var x = L + i * slot + (slot - bw) / 2, yb = T + ph;
      Object.keys(d.by_type || {}).forEach(function (k) {
        var v = d.by_type[k]; if (!v) return; var h = v / top * ph; yb -= h;
        s += '<rect x="' + x.toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + (TC[k] || '#8793a3') + '"><title>' + esc(dm(d.date) + ' ' + (TN[k] || k) + ' ' + v + ' min') + '</title></rect>';
      });
      if (d.minutes > 0 && n <= 14) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (yb - 3).toFixed(1) + '" class="vz-ax" text-anchor="middle">' + d.minutes + '</text>';
      if (i % every === 0) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" class="vz-ax" text-anchor="middle">' + (n <= 14 ? wd(d.date) : dm(d.date)) + '</text>';
    });
    var leg = Object.keys(used).map(function (k) { return '<span class="vz-key"><i style="background:' + (TC[k] || '#8793a3') + '"></i>' + esc(TN[k] || k) + '</span>'; }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="vz-svg" role="img" aria-label="Träningstid per dag i minuter, uppdelat på passtyp">' + s + '</svg><div class="vz-legend">' + leg + '</div><p class="vz-note">Staplarna visar minuter per dag. Färgen visar vilken sorts träning.</p>';
  }

  function weekBars(weeks) {
    if (!weeks || weeks.length < 2) return '';
    var W = 320, H = 150, L = 34, B = 24, T = 16, n = weeks.length, max = 0;
    weeks.forEach(function (w) { if (w.load > max) max = w.load; });
    if (!max) return '';
    var ph = H - B - T, slot = (W - L - 6) / n, bw = Math.max(5, Math.min(36, slot - 4)), s = '', every = n <= 10 ? 1 : Math.ceil(n / 8);
    s += '<line x1="' + L + '" x2="' + (W - 4) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" class="vz-grid"/>';
    weeks.forEach(function (w, i) {
      var h = w.load / max * ph, x = L + i * slot + (slot - bw) / 2, y = T + ph - h;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="var(--accent,#c8102e)"><title>' + esc('Vecka från ' + w.week + ': belastning ' + w.load + ', ' + w.sessions + ' pass') + '</title></rect>';
      if (n <= 10) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 3).toFixed(1) + '" class="vz-ax" text-anchor="middle">' + w.load + '</text>';
      if (i % every === 0) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" class="vz-ax" text-anchor="middle">' + dm(w.week) + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="vz-svg" role="img" aria-label="Belastning per vecka">' + s + '</svg><p class="vz-note">Belastning per vecka (RPE × minuter). Veckorna är markerade med måndagens datum.</p>';
  }

  function line(rows, key, label, lo, hi, color, lowIsGood, hint) {
    var pts = (rows || []).filter(function (r) { return r[key] != null; });
    if (!pts.length) return '';
    var W = 320, H = 100, L = 24, B = 18, T = 8, ph = H - B - T, n = rows.length, s = '', i, avg = 0;
    function X(i) { return L + (n === 1 ? (W - L - 8) / 2 : i / (n - 1) * (W - L - 12)); }
    function Y(v) { return T + ph - (v - lo) / (hi - lo) * ph; }
    for (var g = lo; g <= hi; g += (hi - lo > 5 ? 2 : 1)) s += '<line x1="' + L + '" x2="' + (W - 6) + '" y1="' + Y(g) + '" y2="' + Y(g) + '" class="vz-grid"/><text x="' + (L - 4) + '" y="' + (Y(g) + 3) + '" class="vz-ax" text-anchor="end">' + g + '</text>';
    var seg = [], d = '';
    rows.forEach(function (r, idx) { if (r[key] == null) { if (d) seg.push(d); d = ''; return; } d += (d ? ' L' : 'M') + X(idx).toFixed(1) + ' ' + Y(r[key]).toFixed(1); });
    if (d) seg.push(d);
    seg.forEach(function (p) { s += '<path d="' + p + '" fill="none" stroke="' + color + '" stroke-width="2"/>'; });
    rows.forEach(function (r, idx) { if (r[key] != null) { avg += Number(r[key]); s += '<circle cx="' + X(idx).toFixed(1) + '" cy="' + Y(r[key]).toFixed(1) + '" r="3" fill="' + color + '"><title>' + esc(dm(r.date) + ': ' + r[key]) + '</title></circle>'; } });
    avg = avg / pts.length;
    var every = n <= 10 ? 1 : Math.ceil(n / 7);
    rows.forEach(function (r, idx) { if (idx % every === 0) s += '<text x="' + X(idx).toFixed(1) + '" y="' + (H - 4) + '" class="vz-ax" text-anchor="middle">' + (n <= 10 ? wd(r.date) : dm(r.date)) + '</text>'; });
    return '<div class="vz-line"><div class="vz-lh"><b>' + esc(label) + '</b><span>snitt ' + (Math.round(avg * 10) / 10) + '</span></div><svg viewBox="0 0 ' + W + ' ' + H + '" class="vz-svg" role="img" aria-label="' + esc(label) + ' över tid">' + s + '</svg><div class="vz-note" style="margin:0">' + esc(hint) + '</div></div>';
  }

  function wellness(w) {
    if (!w || !w.length) return '<p class="vz-note">Ingen morgonkoll under perioden.</p>';
    var h = '';
    h += line(w, 'sleep', 'Sömn (kvalitet)', 1, 5, '#4a7be0', false, '1 = dåligt, 5 = bra. Höjd linje är bra.');
    h += line(w, 'energy', 'Energi', 1, 5, '#1f9d8f', false, '1 = slut, 5 = full av energi. Höjd linje är bra.');
    h += line(w, 'soreness', 'Ömhet', 1, 5, '#e0661a', true, '1 = inte öm, 5 = mycket öm. Stigande linje betyder mer träningsvärk.');
    h += line(w, 'stress', 'Stress', 1, 5, '#c2417f', true, '1 = lugn, 5 = mycket stressad.');
    var wt = w.filter(function (r) { return r.weight != null; });
    if (wt.length > 1) { var mn = Math.floor(Math.min.apply(null, wt.map(function (r) { return Number(r.weight); }))) - 1, mx = Math.ceil(Math.max.apply(null, wt.map(function (r) { return Number(r.weight); }))) + 1; h += line(w, 'weight', 'Vikt (kg)', mn, Math.max(mx, mn + 2), '#7a8594', false, 'Vikt på morgonen. Jämför mot viktklassens gräns.'); }
    return h;
  }

  function typeBars(types) {
    var ks = Object.keys(types || {}).filter(function (k) { return types[k] > 0; }), tot = 0;
    ks.forEach(function (k) { tot += types[k]; });
    if (!tot) return '';
    ks.sort(function (a, b) { return types[b] - types[a]; });
    return '<div class="vz-hb">' + ks.map(function (k) { var p = Math.round(types[k] / tot * 100); return '<div class="vz-hr"><span>' + esc(TN[k] || k) + '</span><div class="vz-hbar"><i style="width:' + p + '%;background:' + (TC[k] || '#8793a3') + '"></i></div><b>' + p + ' %</b></div>'; }).join('') + '</div><p class="vz-note">Så fördelas träningstiden mellan olika sorters träning.</p>';
  }

  function passRows(passes) {
    if (!passes || !passes.length) return '';
    return '<div class="vz-pl">' + passes.slice(-14).map(function (p) { return '<div class="vz-pr"><span class="vz-pd">' + wd(p.date) + ' ' + dm(p.date) + '</span><span>' + (p.types || []).map(tag).join('') + '</span><span class="vz-rpe" title="RPE ' + esc(p.rpe) + ' av 10"><i style="width:' + (p.rpe * 10) + '%"></i></span><span class="vz-pm">' + (p.minutes ? esc(p.minutes) + ' min' : '') + ' · RPE ' + esc(p.rpe) + '</span></div>'; }).join('') + '</div><p class="vz-note">Längden på det röda strecket visar hur tungt passet var (RPE av 10).</p>';
  }

      '<div class="card"><fieldset><legend>Har du någon värk eller smärta efter passet?</legend><div class="grid g2"><label class="pick"><input type="radio" name="ppain" value="no"' + (edit && !p.pain ? ' checked' : '') + '><span>Nej</span></label><label class="pick"><input type="radio" name="ppain" value="yes"' + (p.pain ? ' checked' : '') + '><span>Ja</span></label></div>' +
      '<div id="ppw" ' + (p.pain ? '' : 'hidden ') + 'style="margin-top:10px"><label class="f" for="ppl">Var och hur illa?</label><input type="text" id="ppl" maxlength="200" value="' + esc(p.pain_location || '') + '"></div></fieldset></div>' +
      '<div class="card"><label class="f" for="pdid">Vad gjorde du?</label><span class="hint" style="margin-bottom:6px">Till exempel: knäböj 5x5 och marklyft, eller 5 ronder sparring, eller löpning 6 km. Skriv fritt.</span><textarea id="pdid" maxlength="1500">' + esc(p.did || '') + '</textarea></div>' +
      '<div class="card"><label class="f" for="pfelt">Hur kändes det?</label><span class="hint" style="margin-bottom:6px">Vad funkade, vad var svårt, vad vill du jobba på. Skriv fritt.</span><textarea id="pfelt" maxlength="1500">' + esc(p.felt || '') + '</textarea></div>' +
      '<p id="perr" hidden role="alert"></p><div class="stack"><button class="btn" type="submit">' + (edit ? 'Spara ändringar' : 'Spara pass') + '</button><button class="btn sec" type="button" id="pcancel">Avbryt</button></div></form>');
    var f = $('pform');
    f.addEventListener('change', function (e) { if (e.target && e.target.name === 'ppain') $('ppw').hidden = e.target.value !== 'yes'; if (e.target && e.target.name === 'pmin') $('pmc').value = ''; });
    $('pmc').addEventListener('input', function () { Array.prototype.forEach.call(document.querySelectorAll('input[name=pmin]'), function (r) { r.checked = false; }); });
    $('pcancel').onclick = function () { render(); };
    f.onsubmit = function (e) {
      e.preventDefault();
      var er = $('perr'), sel = [];
      Array.prototype.forEach.call(document.querySelectorAll('input[name=ptype]:checked'), function (c) { sel.push(c.value); });
      var rpe = val('prpe'), pain = val('ppain'), m = numv('pmc'); if (m == null) { var cm = val('pmin'); m = cm ? +cm : null; }
      if (!sel.length) { say(er, 'Välj minst en passtyp.'); return; }
      if (!rpe) { say(er, 'Ange hur tungt passet var.'); return; }
      if (!m || m < 1 || m > 600) { say(er, 'Ange hur länge passet var.'); return; }
      if (!pain) { say(er, 'Svara om du har någon värk.'); return; }
      var btn = f.querySelector('button[type=submit]'); btn.disabled = true;
      rpc('fp5_submit_pass', { p_token: token, p_id: edit ? p.id : null, p_date: $('pdate').value, p_types: sel, p_rpe: +rpe, p_minutes: Math.round(m), p_pain: pain === 'yes', p_pain_location: pain === 'yes' ? $('ppl').value : null, p_did: $('pdid').value, p_felt: $('pfelt').value })
        .then(function (r) { if (!r || !r.ok) { btn.disabled = false; say(er, errMsg(r)); return; } tab = 'today'; return load(); })
        .catch(function () { btn.disabled = false; say(er, 'Det gick inte att spara. Försök igen.'); });
    };
  }

  /* ---------- MINA PASS ---------- */
  function renderMine() {
    var h = '<div class="card"><h2>Mina pass, senaste 4 veckorna</h2>' + (ctx.passes.length ? ctx.passes.map(passItem).join('') : '<p class="sub" style="margin:0">Inga pass än.</p>') + '<p class="hint" style="margin-top:10px">Du kan ändra pass som är högst 14 dagar gamla.</p></div>' +
      '<div class="card"><h2>Morgonkoll</h2>' + (ctx.daily.length ? ctx.daily.map(function (d) {
        return '<div style="border-top:1px solid var(--border);padding:8px 0"><b>' + esc(d.day) + '</b><div class="sub" style="margin:2px 0 0">Sömn ' + esc(d.sleep) + '/5' + (d.sleep_hours != null ? ' (' + esc(d.sleep_hours) + ' h)' : '') + ' · Energi ' + esc(d.energy) + '/5 · Ömhet ' + esc(d.soreness) + '/5 · Stress ' + esc(d.stress) + '/5' + (d.weight_kg != null ? ' · ' + esc(d.weight_kg) + ' kg' : '') + (d.pain ? ' · Värk: ' + esc(d.pain_location || 'ja') : '') + '</div></div>'; }).join('') : '<p class="sub" style="margin:0">Ingen morgonkoll än.</p>') + '</div>';
    shell(h); bindPassItems();
  }

  /* ---------- ANALYS ---------- */
  function wfetch(mode) {
    return post('/functions/v1/fighter_weekly', { token: token, mode: mode }).catch(function (e) { throw e; });
  }
  function renderWeek() {
    shell('<div class="card" id="wk"><p class="sub" style="margin:0">Laddar…</p></div><div class="card"><h2>Tidigare analyser</h2>' + (ctx.analyses.length ? ctx.analyses.map(function (a) { return '<div style="border-top:1px solid var(--border);padding:10px 0"><b>Vecka från ' + esc(a.week_start) + '</b><div class="txt">' + VZ.render(a.summary) + '</div></div>'; }).join('') : '<p class="sub" style="margin:0">Inga än.</p>') + '</div>');
    var box = $('wk');
    function draw(j) {
      if (j.summary) { box.innerHTML = '<h2>Din veckoanalys</h2><p class="sub" style="margin:0 0 10px">' + esc(j.week_start) + ' till ' + esc(j.week_end) + '</p><div class="txt">' + VZ.render(j.summary) + '</div>'; return; }
      box.innerHTML = '<h2>Din veckoanalys</h2><p class="sub" style="margin:0 0 12px">Få en analys av din vecka (' + esc(j.week_start) + ' till ' + esc(j.week_end) + '). Den bygger på det du fyllt i. Du kan göra en per vecka, från söndag kl 20.</p><button class="btn" type="button" id="wgo">Skapa min veckoanalys</button><p class="err" id="werr" hidden></p>';
      $('wgo').onclick = function () {
        var b = this; b.disabled = true; b.textContent = 'Skriver…';
        wfetch('make').then(function (r) { draw(r); return rpc('fp5_context', { p_token: token }).then(function (c) { if (c && c.ok) ctx = c; }); }).catch(function (e) {
          b.disabled = false; b.textContent = 'Skapa min veckoanalys';
          say($('werr'), e.code === 'ingen_data' ? 'Du har inga pass den här veckan än.' : 'Det gick inte nu. Försök igen om en stund.');
        });
      };
    }
    wfetch('get').then(draw).catch(function () { box.innerHTML = '<p class="sub" style="margin:0">Veckoanalysen är inte tillgänglig just nu.</p>'; });
  }

  if (!token) { showInvalid(); } else { load(); }
}());
</script>
</body>
</html>
