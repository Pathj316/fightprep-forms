<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Incheckning efter pass</title>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--text:#14181f;--muted:#586272;--border:#d5dbe3;
  --accent:#c8102e;--accent-text:#ffffff;--ok:#167a43;--danger:#b42318;--chip:#eef1f5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1115;--surface:#171c23;--text:#eef1f5;--muted:#9aa5b4;--border:#2b3340;
    --accent:#e5384f;--accent-text:#ffffff;--ok:#4cc38a;--danger:#ff8a80;--chip:#212934}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.45rem;line-height:1.2;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin:0 0 14px}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:650;padding:0;margin:0 0 8px;width:100%}
.hint{display:block;font-weight:400;color:var(--muted);font-size:.86rem;margin-top:2px}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.pick{position:relative;display:block}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pick span{display:flex;align-items:center;justify-content:center;min-height:48px;padding:6px 8px;text-align:center;
  border:1px solid var(--border);border-radius:11px;background:var(--surface);font-weight:600}
.pick input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.pick input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-top:6px}
input[type=date],input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
label.f{display:block;font-weight:650;margin:0 0 6px}
.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:700;
  min-height:52px;padding:0 18px;width:100%;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--text);border:1px solid var(--border);font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-weight:600;margin:0 0 12px}
.center{text-align:center}
.big{font-size:2.4rem;margin:0}
.muted{color:var(--muted)}
.stack>*+*{margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app">
  <p class="muted">Laddar…</p>
</main>
<noscript><main><p>Sidan kräver JavaScript.</p></main></noscript>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://rgsbhkqwmilragkiogkr.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnc2Joa3F3bWlscmFna2lvZ2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxOTk3MzQsImV4cCI6MjA4MDc3NTczNH0.cCtGnUwa3ynQNDUIYhhhXT6vT04MeaM1mn3flHgFEEU';

  var TYPES = [
    ['grappling', 'Grappling'], ['striking', 'Striking'], ['mma', 'MMA'], ['wrestling', 'Brottning'],
    ['styrka', 'Styrka'], ['kondition', 'Kondition'], ['sparring', 'Sparring'], ['annat', 'Annat']
  ];
  var ERRORS = {
    ogiltig_lank: 'Länken fungerar inte längre. Be din tränare om en ny.',
    for_gammalt_datum: 'Datumet är för gammalt. Du kan checka in på pass de senaste 14 dagarna.',
    ogiltigt_varde: 'Något svar är ogiltigt. Kontrollera och försök igen.',
    for_manga: 'För många försök på kort tid. Vänta en stund och försök igen.'
  };

  var app = document.getElementById('app');
  var token = getToken();
  var ctx = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getToken() {
    var m = location.hash.match(/[#&]t=([A-Za-z0-9]+)/) || location.search.match(/[?&]t=([A-Za-z0-9]+)/);
    return m ? m[1] : '';
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

  function rpc(fn, body) {
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) { throw new Error((j && j.message) || ('Fel ' + r.status)); }
        return j;
      });
    });
  }

  function scale(name, from, to, cols) {
    var h = '<div class="grid ' + cols + '">';
    for (var i = from; i <= to; i++) {
      h += '<label class="pick"><input type="radio" name="' + name + '" value="' + i + '"><span>' + i + '</span></label>';
    }
    return h + '</div>';
  }


  function fmt(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
  function wfetch(mode) {
    return fetch(SUPABASE_URL + '/functions/v1/fighter_weekly', {
      method: 'POST',
      headers: { apikey: ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, mode: mode })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ('Fel ' + r.status)); e.code = j.error; throw e; } return j; });
    });
  }
  function weekly() {
    var box = document.getElementById('wk');
    if (!box) { return; }
    function draw(j) {
      if (j.summary) {
        box.innerHTML = '<h2 style="margin:0 0 8px;font-size:18px">Din veckoanalys</h2><p class="muted" style="margin:0 0 10px">Vecka ' + esc(j.week_start) + ' – ' + esc(j.week_end) + '</p><div>' + fmt(j.summary) + '</div>';
        return;
      }
      box.innerHTML = '<h2 style="margin:0 0 8px;font-size:18px">Din veckoanalys</h2><p class="muted" style="margin:0 0 10px">Få en analys av din vecka (' + esc(j.week_start) + ' – ' + esc(j.week_end) + ') baserat på dina svar. Du kan göra den en gång i veckan.</p>' +
        '<button class="btn sec" type="button" id="wgo">Skapa min veckoanalys</button><p class="err" id="werr" hidden></p>';
      document.getElementById('wgo').onclick = function () {
        var b = this; b.disabled = true; b.textContent = 'Skriver…';
        wfetch('make').then(draw).catch(function (e) {
          b.disabled = false; b.textContent = 'Skapa min veckoanalys';
          var w = document.getElementById('werr'); w.hidden = false;
          w.textContent = e.code === 'ingen_data' ? 'Du har inga incheckningar den här veckan än.' : 'Det gick inte nu. Försök igen om en stund.';
        });
      };
    }
    wfetch('get').then(draw).catch(function () { box.hidden = true; });
  }

  function showInvalid() {
    app.innerHTML = '<h1>Länken fungerar inte</h1>' +
      '<p class="sub">Den här länken är ogiltig eller avstängd. Be din tränare om en ny länk.</p>';
  }

  function showForm() {
    var today = new Date();
    var min = new Date(); min.setDate(min.getDate() - 14);
    var last = store('fp2_last_type') || '';
    var typeHtml = TYPES.map(function (t) {
      return '<label class="pick"><input type="radio" name="type" value="' + t[0] + '"' + (t[0] === last ? ' checked' : '') +
        '><span>' + t[1] + '</span></label>';
    }).join('');

    app.innerHTML =
      '<div id="done" class="card center" hidden>' +
        '<p class="big" aria-hidden="true">✓</p>' +
        '<h1 id="doneTitle">Tack!</h1>' +
        '<p class="sub" id="doneText">Ditt svar är sparat.</p>' +
        '<div class="stack">' +
          '<button class="btn sec" type="button" id="again">Fyll i ett annat pass</button>' +
          '<button class="btn sec" type="button" id="edit">Ändra mitt svar</button>' +
        '</div>' +
      '</div>' +
      '<form id="form" novalidate>' +
        '<h1>Hej ' + esc(ctx.name || '') + '!</h1>' +
        '<p class="sub">Några snabba frågor om passet. Det tar under en minut.</p>' +
        '<div class="card"><fieldset><legend>Vilket pass?</legend><div class="grid g2">' + typeHtml + '</div></fieldset></div>' +
        '<div class="card"><label class="f" for="date">Datum</label>' +
          '<input type="date" id="date" name="date" value="' + ymd(today) + '" min="' + ymd(min) + '" max="' + ymd(today) + '"></div>' +
        '<div class="card"><fieldset><legend>Hur tungt var passet?<span class="hint">1 = mycket lätt, 10 = maximalt</span></legend>' +
          scale('rpe', 1, 10, 'g5') + '</fieldset></div>' +
        '<div class="card"><fieldset><legend>Hur mycket energi hade du?</legend>' + scale('energy', 1, 5, 'g5') +
          '<div class="ends"><span>Slut</span><span>Full av energi</span></div></fieldset></div>' +
        '<div class="card"><fieldset><legend>Hur sov du natten innan?</legend>' + scale('sleep', 1, 5, 'g5') +
          '<div class="ends"><span>Dåligt</span><span>Bra</span></div></fieldset></div>' +
        '<div class="card"><fieldset><legend>Hur är humöret?</legend>' + scale('mood', 1, 5, 'g5') +
          '<div class="ends"><span>Dåligt</span><span>Bra</span></div></fieldset></div>' +
        '<div class="card"><fieldset><legend>Har du någon värk eller smärta?</legend>' +
          '<div class="grid g2">' +
            '<label class="pick"><input type="radio" name="pain" value="no"><span>Nej</span></label>' +
            '<label class="pick"><input type="radio" name="pain" value="yes"><span>Ja</span></label>' +
          '</div>' +
          '<div id="painWrap" hidden style="margin-top:10px"><label class="f" for="painLoc">Var?</label>' +
            '<input type="text" id="painLoc" name="painLoc" maxlength="200" placeholder="t.ex. vänster knä"></div>' +
        '</fieldset></div>' +
        '<div class="card"><label class="f" for="went">Vad funkade bra?</label>' +
          '<textarea id="went" name="went" maxlength="1000"></textarea></div>' +
        '<div class="card"><label class="f" for="work">Vad vill du jobba på?</label>' +
          '<textarea id="work" name="work" maxlength="1000"></textarea></div>' +
        '<p class="err" id="err" role="alert" hidden></p>' +
        '<button class="btn" type="submit" id="send">Skicka</button>' +
      '</form><div class="card" id="wk"></div>';

    var form = document.getElementById('form');
    weekly();
    form.addEventListener('change', function (e) {
      if (e.target && e.target.name === 'pain') {
        document.getElementById('painWrap').hidden = e.target.value !== 'yes';
      }
    });
    form.addEventListener('submit', function (e) { e.preventDefault(); submit(form); });
    document.getElementById('again').addEventListener('click', function () { resetForm(form); showFormOnly(); });
    document.getElementById('edit').addEventListener('click', showFormOnly);
  }

  function showFormOnly() {
    document.getElementById('done').hidden = true;
    document.getElementById('form').hidden = false;
    window.scrollTo(0, 0);
  }

  function resetForm(form) {
    form.reset();
    var d = document.getElementById('date');
    d.value = ymd(new Date());
    document.getElementById('painWrap').hidden = true;
    var last = store('fp2_last_type');
    if (last) { var r = form.querySelector('input[name=type][value="' + last + '"]'); if (r) r.checked = true; }
  }

  function val(form, name) {
    var el = form.querySelector('input[name="' + name + '"]:checked');
    return el ? el.value : null;
  }

  function submit(form) {
    var err = document.getElementById('err');
    var type = val(form, 'type'), rpe = val(form, 'rpe'), energy = val(form, 'energy'),
        sleep = val(form, 'sleep'), mood = val(form, 'mood'), pain = val(form, 'pain'),
        date = document.getElementById('date').value;
    var missing = [];
    if (!type) missing.push('pass');
    if (!date) missing.push('datum');
    if (!rpe) missing.push('hur tungt');
    if (!energy) missing.push('energi');
    if (!sleep) missing.push('sömn');
    if (!mood) missing.push('humör');
    if (!pain) missing.push('värk (ja eller nej)');
    if (missing.length) {
      err.textContent = 'Fyll i: ' + missing.join(', ') + '.';
      err.hidden = false;
      return;
    }
    err.hidden = true;
    var btn = document.getElementById('send');
    btn.disabled = true; btn.textContent = 'Skickar…';

    rpc('fp2_submit_checkin', {
      p_token: token,
      p_date: date,
      p_type: type,
      p_rpe: parseInt(rpe, 10),
      p_energy: parseInt(energy, 10),
      p_sleep: parseInt(sleep, 10),
      p_mood: parseInt(mood, 10),
      p_pain: pain === 'yes',
      p_pain_location: document.getElementById('painLoc').value,
      p_went_well: document.getElementById('went').value,
      p_work_on: document.getElementById('work').value
    }).then(function (res) {
      btn.disabled = false; btn.textContent = 'Skicka';
      if (!res || !res.ok) {
        err.textContent = ERRORS[res && res.error] || 'Det gick inte att spara. Försök igen.';
        err.hidden = false;
        return;
      }
      store('fp2_last_type', type);
      var n = (ctx.checkins_28d || 0) + (res.updated ? 0 : 1);
      if (!res.updated) { ctx.checkins_28d = n; }
      document.getElementById('doneTitle').textContent = res.updated ? 'Uppdaterat!' : 'Tack, ' + (ctx.name || '') + '!';
      document.getElementById('doneText').textContent = 'Ditt svar är sparat. Du har checkat in ' + n + (n === 1 ? ' gång' : ' gånger') + ' de senaste 28 dagarna.';
      document.getElementById('form').hidden = true;
      document.getElementById('done').hidden = false;
      window.scrollTo(0, 0);
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Skicka';
      err.textContent = 'Ingen kontakt med servern. Kontrollera uppkopplingen och försök igen. Dina svar finns kvar.';
      err.hidden = false;
    });
  }

  if (!token || token.length < 40) { showInvalid(); return; }
  rpc('fp2_checkin_context', { p_token: token }).then(function (c) {
    if (!c || !c.ok) { showInvalid(); return; }
    ctx = c;
    showForm();
  }).catch(function () {
    app.innerHTML = '<h1>Ingen kontakt</h1><p class="sub">Det gick inte att nå servern. Kontrollera uppkopplingen och ladda om sidan.</p>';
  });
})();
</script>
</body>
</html>
