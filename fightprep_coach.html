<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FightPrep – Coach</title>
<style>
:root{color-scheme:dark;--bg:#050a07;--surface:#0b1710;--text:#e9f4ec;--muted:#8fae9b;--border:#1b3326;--accent:#1f9d5c;--accent-text:#fff;--ok:#34d399;--danger:#f97316;--chip:#10201a}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.bar{max-width:760px;margin:0 auto;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:1rem;margin:0 auto 0 0}
.tab{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:9px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:14px 12px 70px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin:0 0 12px}
h2{font-size:1.1rem;margin:0 0 8px}h3{font-size:.98rem;margin:14px 0 6px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.88rem}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px;min-height:44px}
textarea{min-height:76px;resize:vertical}
.btn{border:0;border-radius:9px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:700;padding:0 14px;min-height:44px;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--text);border:1px solid var(--border);font-weight:600}
.btn.sm{min-height:36px;padding:0 10px;font-size:.88rem}.btn:disabled{opacity:.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 8px;font:inherit;color:var(--text);cursor:pointer}
.muted{color:var(--muted)}.small{font-size:.86rem}.err{color:var(--danger);font-weight:600}.ok{color:var(--ok);font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:700;background:var(--chip);border:1px solid var(--border);margin:0 4px 4px 0}
.note{border-left:3px solid var(--border);padding:4px 0 4px 10px;margin:8px 0}
.note q{display:block;color:var(--muted);font-size:.82rem;quotes:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gp h3{margin-top:16px}.gp ul{margin:4px 0 4px 18px;padding:0}
[hidden]{display:none!important}

/* VZ */
.vz-card{background:var(--surface,#fff);border:1px solid var(--border,#d5dbe3);border-left:4px solid var(--border,#d5dbe3);border-radius:12px;padding:14px;margin:0 0 12px}
.vz-card.good{border-left-color:#1f9d6b}.vz-card.work{border-left-color:#d99a06}.vz-card.warn{border-left-color:#f97316}.vz-card.info{border-left-color:#60a5fa}
.vz-card h3{margin:0 0 8px;font-size:1.02rem}
.vz-card p{margin:0 0 8px}
.vz-h{margin:4px 0 10px;font-size:1.25rem}
.vz-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 6px}
.vz-tile{background:var(--surface,#fff);border:1px solid var(--border,#d5dbe3);border-radius:12px;padding:10px 12px}
.vz-l{font-size:.82rem;color:var(--muted,#586272)}
.vz-v{font-size:1.5rem;font-weight:700;line-height:1.2}.vz-v small{font-size:.8rem;font-weight:500;color:var(--muted,#586272)}
.vz-d{font-size:.78rem;color:var(--muted,#586272)}
.vz-note{font-size:.82rem;color:var(--muted,#586272);margin:6px 0 10px}
.vz-svg{width:100%;height:auto;display:block}
.vz-grid{stroke:var(--border,#d5dbe3);stroke-width:1}
.vz-ax{fill:var(--muted,#586272);font-size:9px}
.vz-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 4px}
.vz-key{font-size:.8rem;display:inline-flex;align-items:center;gap:5px}.vz-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.vz-line{margin:0 0 10px}.vz-lh{display:flex;justify-content:space-between;font-size:.9rem}.vz-lh span{color:var(--muted,#586272)}
.vz-hb{display:grid;gap:6px}.vz-hr{display:grid;grid-template-columns:88px 1fr 44px;gap:8px;align-items:center;font-size:.9rem}
.vz-hbar{background:var(--chip,#eef1f5);border-radius:6px;height:12px;overflow:hidden}.vz-hbar i{display:block;height:100%}
.vz-pl{display:grid;gap:6px}.vz-pr{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;align-items:center;font-size:.88rem;padding:6px 0;border-top:1px solid var(--border,#d5dbe3)}
.vz-pd{font-weight:600}.vz-rpe{grid-column:1/3;background:var(--chip,#eef1f5);border-radius:6px;height:8px;overflow:hidden;display:block}.vz-rpe i{display:block;height:100%;background:var(--accent,#1f9d5c)}.vz-pm{grid-column:1/3;color:var(--muted,#586272);font-size:.8rem}
.vz-tag{display:inline-block;border:1px solid;border-radius:99px;padding:0 8px;font-size:.78rem;margin:0 4px 2px 0}
.vz-it{padding:8px 0 8px 10px;border-left:3px solid var(--border,#d5dbe3);margin:0 0 8px}.vz-it.good{border-left-color:#1f9d6b}.vz-it.work{border-left-color:#d99a06}.vz-it.warn{border-left-color:#f97316}.vz-it.info{border-left-color:#60a5fa}
.vz-why{font-size:.86rem;color:var(--muted,#586272);margin-top:2px}
.vz-chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:700;color:#fff;background:#60a5fa;margin:0 0 6px}.vz-chip.good{background:#1f9d6b}.vz-chip.warn{background:#f97316}.vz-chip.work{background:#d99a06}
.vz-sc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 8px}
.vz-t{border-collapse:collapse;width:100%;font-size:.86rem}.vz-t th,.vz-t td{border-bottom:1px solid var(--border,#d5dbe3);padding:6px 8px;text-align:left;vertical-align:top}
.vz-team th[scope=row]{position:sticky;left:0;background:var(--surface,#fff);white-space:nowrap;z-index:1}
.vz-c{white-space:nowrap}.vz-c.ok{background:rgba(31,157,107,.16)}.vz-c.mid{background:rgba(217,154,6,.22)}.vz-c.bad{background:rgba(214,58,84,.24)}.vz-c.info{background:rgba(74,123,224,.16)}.vz-c.na{color:var(--muted,#586272)}
.vz-s{font-weight:700}
.vz-sw{padding:1px 6px;border-radius:6px}.vz-sw.ok{background:rgba(31,157,107,.16)}.vz-sw.mid{background:rgba(217,154,6,.22)}.vz-sw.bad{background:rgba(214,58,84,.24)}
.vz-legacy{line-height:1.5}

.vz-card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.vz-card>summary::-webkit-details-marker{display:none}
.vz-card>summary::after,.vz-sub>summary::after{content:'▾';color:var(--muted,#586272);transition:transform .15s}
.vz-card:not([open])>summary::after,.vz-sub:not([open])>summary::after{transform:rotate(-90deg)}
.vz-card>summary h3{margin:0}
.vz-body{margin-top:10px}
.vz-sub{border-top:1px solid var(--border,#d5dbe3);padding:8px 0}
.vz-sub>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;min-height:30px;align-items:center}
.vz-sub>summary::-webkit-details-marker{display:none}
.vz-sub .vz-body{margin-top:6px}
.vz-sub.work{border-left:3px solid #d99a06;padding-left:8px}
.vz-tg{margin:0 0 10px;text-align:right}
.vz-btn{background:transparent;border:1px solid var(--border,#d5dbe3);color:inherit;border-radius:8px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;min-height:36px}
.vz-card p+p{margin-top:8px}

#prt{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#e9ecf0;overflow:auto;-webkit-overflow-scrolling:touch}
#prt .prt-bar{position:sticky;top:0;display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #c9ced6;z-index:2}
#prt .prt-page{background:#fff;color:#111;max-width:210mm;margin:12px auto;padding:16mm;font:10.5pt/1.5 Georgia,"Times New Roman",serif;box-shadow:0 1px 6px rgba(0,0,0,.15);box-sizing:border-box}
#prt h1{font:700 21pt/1.15 Helvetica,Arial,sans-serif;margin:2px 0 4px;color:#111}
#prt h2{font:700 11pt/1.2 Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;padding-bottom:3px;border-bottom:1.5px solid #111;color:#111}
#prt h3{font:700 11pt/1.3 Helvetica,Arial,sans-serif;margin:0 0 3px;color:#111}
#prt p{margin:0 0 6px;color:#111}
#prt .k{font:8.5pt Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#555}
#prt .meta{font:9.5pt Helvetica,Arial,sans-serif;color:#333}
#prt .hd{border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:6px}
#prt .kpi{display:flex;gap:8px;margin:8px 0}
#prt .kpi div{flex:1;border:1px solid #111;padding:6px 8px}
#prt .kpi b{display:block;font:700 15pt/1.1 Helvetica,Arial,sans-serif}
#prt .kpi span{font:8pt Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#555}
#prt table{width:100%;border-collapse:collapse;font:9.5pt/1.35 Helvetica,Arial,sans-serif;margin:4px 0 8px}
#prt th{text-align:left;border-bottom:1.5px solid #111;padding:3px 6px 3px 0;font-weight:700}
#prt td{border-bottom:1px solid #bbb;padding:3px 6px 3px 0;vertical-align:top}
#prt .bar{display:inline-block;height:7px;background:#111;vertical-align:middle}
#prt .box{border:1px solid #111;padding:8px 10px;margin:0 0 8px;break-inside:avoid;page-break-inside:avoid}
#prt .tag{display:inline-block;font:700 8pt Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;border:1px solid #111;padding:1px 5px;margin-left:6px}
#prt .src{font:9pt/1.4 Helvetica,Arial,sans-serif;color:#333}
#prt .todo{list-style:none;padding:0;margin:0}
#prt .todo li{padding:3px 0 3px 22px;position:relative;border-bottom:1px solid #ddd;break-inside:avoid}
#prt .todo li:before{content:"";position:absolute;left:0;top:6px;width:11px;height:11px;border:1.5px solid #111}
#prt .foot{margin-top:14px;padding-top:6px;border-top:1px solid #111;font:8.5pt/1.4 Helvetica,Arial,sans-serif;color:#444}
#prt ul{margin:0 0 6px 18px;padding:0}
@media screen and (max-width:600px){#prt .prt-page{padding:12px;margin:0}#prt .kpi{flex-wrap:wrap}#prt .kpi div{flex:1 1 45%}#prt table{font-size:8.5pt}}
@media print{
  html,body{background:#fff!important}
  body>*:not(#prt){display:none!important}
  #prt{position:static!important;background:#fff!important;overflow:visible!important}
  #prt .prt-bar{display:none!important}
  #prt .prt-page{margin:0;padding:0;max-width:none;box-shadow:none}
  #prt h2{break-after:avoid;page-break-after:avoid}
  @page{size:A4;margin:14mm 14mm 16mm}
}
/* ===== Dashboard ===== */
#dash{position:fixed;inset:0;z-index:9999;background:#000;--bg:#050a07;--surface:#0b1710;--text:#e9f4ec;--muted:#77957f;--border:#1b3326;--chip:#10201a;--ok:#34d399;--danger:#f97316;--accent:#1f9d5c;color:#e9f4ec;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#dash *{box-sizing:border-box}
#dash button{font:inherit;color:inherit;cursor:pointer}
#dash .dapp{position:absolute;left:0;top:0;width:1366px;height:768px;transform-origin:0 0;background:#050a07;display:grid;grid-template-rows:auto auto 1fr;min-height:0}
#dash .dhdr{display:flex;align-items:center;gap:16px;padding:9px 20px;background:#08110c;border-bottom:1px solid #1b3326}
#dash .dlogo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px}
#dash .dlogo i{width:24px;height:24px;border-radius:7px;background:#1f9d5c;display:grid;place-items:center;font-style:normal;font-size:15px;color:#fff}
#dash .dchip{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 5px;border-radius:99px;background:#0b1710;border:1px solid #1b3326}
#dash .dav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1f9d5c,#0f6b3a);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
#dash .dchip b{display:block;font-size:15px;line-height:1.1}#dash .dchip small{font-size:13px;color:#77957f}
#dash .dinfo{font-size:13px;color:#a9c4b4;max-width:360px;line-height:1.3}
#dash .drng{margin-left:auto;display:flex;background:#0b1710;border:1px solid #1b3326;border-radius:10px;padding:3px}
#dash .drng button{background:none;border:0;padding:5px 13px;border-radius:7px;color:#a9c4b4;font-weight:600;font-size:14px}
#dash .drng button.on{background:#1f9d5c;color:#fff}
#dash .dx{background:#0b1710;border:1px solid #1b3326;border-radius:10px;padding:7px 14px;font-weight:600;color:#e9f4ec}
#dash .dtabs{display:flex;gap:2px;padding:0 14px;background:#08110c;border-bottom:1px solid #1b3326;overflow-x:auto}
#dash .dtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px;color:#a9c4b4;font-weight:600;font-size:15px;white-space:nowrap}
#dash .dtabs button.on{color:#fff;border-bottom-color:#1f9d5c}
#dash main{min-height:0;position:relative;max-width:none;margin:0;padding:0;width:auto}
#dash .dload{padding:30px;color:#a9c4b4}
#dash .panel{position:absolute;inset:0;padding:14px 20px;display:none;min-height:0;gap:12px}
#dash .panel.on{display:grid}
#dash .dcard{background:#0b1710;border:1px solid #1b3326;border-radius:14px;padding:12px 16px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#dash .dcard h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:#77957f;font-weight:700}
#dash .sub{font-size:13px;color:#77957f;margin:2px 0 6px}
#dash .chart{flex:1;min-height:0;position:relative;overflow:hidden}
#dash .chart svg{display:block}
#dash svg text{font-family:inherit;fill:#77957f;font-size:12.5px}
#dash .dnd{height:100%;display:grid;place-items:center;color:#77957f;font-size:14px;text-align:center;padding:8px}
#dash .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#a9c4b4;margin-top:6px}
#dash .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#dash .mut{color:#77957f;font-size:13.5px}
#dash .fn{font-size:12.5px;color:#77957f;margin:6px 0 0}
#dash .chip{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:rgba(34,164,93,.18);color:#7fe0a8}
#dash .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
#dash .kpi{background:#0b1710;border:1px solid #1b3326;border-radius:14px;padding:10px 14px;min-width:0}
#dash .kpi .l{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:#77957f;font-weight:700}
#dash .kpi .v{font-size:27px;font-weight:800;line-height:1.15}#dash .kpi .v small{font-size:14px;font-weight:600;color:#a9c4b4}
#dash .kpi .d{font-size:12.5px;color:#a9c4b4;min-height:18px}
#dash .up{color:#fbbf24}#dash .dn{color:#7fe0a8}#dash .flat{color:#77957f}
#dash #p-overview{grid-template-rows:auto 1fr 170px}
#dash #p-overview .mid{display:grid;grid-template-columns:1.9fr 1fr;gap:12px;min-height:0}
#dash #p-overview .bot{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-height:0}
#dash .ai{display:flex;flex-direction:column;gap:8px;overflow:auto}
#dash .ai p{margin:0;font-size:15px;line-height:1.5;color:#e9f4ec}
#dash .link{color:#7fe0a8;background:none;border:0;padding:0;font-weight:600;text-align:left}
#dash #p-training{grid-template-columns:1fr 2.2fr;grid-template-rows:1fr 1fr}
#dash #p-training .t1{grid-row:1/3;display:flex;flex-direction:column;min-height:0}#dash #p-training .t1>.dcard,#dash #p-training .t2>.dcard{flex:1}
#dash #p-training .t2{display:flex;min-height:0}#dash #p-training .t2>.dcard{width:100%}
#dash #p-training .rt{grid-column:2;display:grid;grid-template-columns:1.5fr 1fr;gap:12px;min-height:0}
#dash .nl{overflow:auto;flex:1;min-height:0}
#dash .nt{border-top:1px solid #1b3326;padding:7px 0;font-size:14px;color:#a9c4b4}#dash .nt:first-child{border-top:0}
#dash .nt b{color:#e9f4ec}
#dash .dh{display:flex;flex-direction:column;gap:12px;padding-top:6px}
#dash .dhr{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;font-size:14px}
#dash .dhl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
#dash .dhb{background:#10201a;border-radius:6px;height:14px;overflow:hidden;display:block}#dash .dhb b{display:block;height:100%;border-radius:6px}
#dash .dhv{color:#a9c4b4;font-size:13px;text-align:right}
#dash #p-body{grid-template-columns:1fr 1fr 300px;grid-template-rows:1fr 1fr}
#dash #p-body .tbl{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;min-height:0}#dash #p-body .tbl>.dcard{flex:1}
#dash #p-weight{grid-template-columns:2.1fr 1fr;grid-template-rows:auto 1fr}
#dash #p-weight .wk{grid-column:1;grid-row:1/3;display:flex;min-height:0}#dash #p-weight .wk>.dcard{width:100%}
#dash #p-weight>div{min-height:0;display:flex}#dash #p-weight>div>.dcard{width:100%}
#dash .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#dash .stat{background:#10201a;border:1px solid #1b3326;border-radius:10px;padding:8px 11px}
#dash .stat b{display:block;font-size:20px}#dash .stat span{font-size:13px;color:#77957f}
#dash #p-analysis{grid-template-columns:360px 1fr}
#dash #p-analysis>div{min-height:0;display:flex}#dash #p-analysis>div>.dcard{width:100%}
#dash .list,#dash .det{overflow:auto;flex:1;min-height:0;margin-top:6px}
#dash .list .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid #1b3326;border-radius:11px;margin-bottom:8px;background:#10201a;text-align:left;width:100%}
#dash .list .it.on{border-color:#1f9d5c;background:#10301f}
#dash .list .n{flex:none;width:22px;height:22px;border-radius:7px;background:#1b3326;display:grid;place-items:center;font-size:13px;font-weight:800}
#dash .list .t{flex:1;font-weight:600;font-size:14px}#dash .list small{color:#77957f;font-weight:400}
#dash #p-layers{display:block;overflow:auto}
#dash .lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
#dash .lg .card{background:#0b1710;border:1px solid #1b3326;border-radius:14px;padding:12px 16px;margin:0}
#dash #p-profile{grid-template-columns:320px 1fr}
#dash #p-profile>div:first-child{min-height:0;display:flex}#dash #p-profile>div:first-child>.dcard{width:100%;overflow:auto}
#dash .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#dash .facts div{background:#10201a;border:1px solid #1b3326;border-radius:10px;padding:8px 10px;min-width:0}
#dash .facts span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#77957f}#dash .facts b{font-size:16px;overflow-wrap:anywhere}
#dash .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;overflow:auto;min-height:0}
#dash .ptxt{margin:8px 0 0;font-size:15.5px;line-height:1.55;color:#a9c4b4;white-space:pre-wrap}
/* lagrens och analysens återanvända kort, mörkt */
#dash .vz-card,#dash .vz-it{color:#e9f4ec}
/* mobil: samma layout, staplad */
#dash.mob{overflow:auto;-webkit-overflow-scrolling:touch}
#dash.mob .dapp{position:relative;width:100%!important;height:auto!important;min-height:100%;display:block}
#dash.mob .dhdr{flex-wrap:wrap;gap:8px 10px;padding:8px 12px;position:sticky;top:0;z-index:3}

function voiceCard(cfg){

      rec.onresult=function(e){var interim='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)base+=r[0].transcript.trim()+' ';else interim+=r[0].transcript}$('vt').value=base+interim};
      rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){stop();fail($('vm'),new Error('Mikrofonen är inte tillåten i webbläsaren.'))}};
      rec.onend=function(){if(on){try{rec.start()}catch(e){stop()}}};

    h+=r.flags.map(function(f,i){return '<div class="note" data-rf="'+i+'"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-on checked> <b>Flagga:</b> '+esc(nm(f.fighter_id))+' – '+esc(FN[f.flag]||f.flag)+'</label></div>'}).join('');
    if(r.week_note)h+='<div class="note"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rwc" checked> <b>Veckans helhetsbild</b> (läggs till under den du har)</label><textarea id="rwt" style="min-height:50px">'+esc(r.week_note)+'</textarea></div>';

    };
  }
  $('vsort').onclick=function(){
    stop();var t=nz($('vt').value);if(!t){fail($('vm'),new Error('Prata in eller skriv något först.'));return}
    var b=this;b.disabled=true;b.textContent='Sorterar…';$('vm').textContent='';$('vr').innerHTML='';
    (cfg.fixed?Promise.resolve(cfg.fixed):rpc('fp3_list_fighters')).then(function(a){FL=(a||[]).map(function(f){return{id:f.id,name:f.name}});return api('/functions/v1/coach_voice_sort',{text:t,fighters:FL,date:VD(),type:VT(),fixed:!!cfg.fixed})}).then(function(r){b.disabled=false;b.textContent='Sortera med AI';review(r)}).catch(function(er){b.disabled=false;b.textContent='Sortera med AI';fail($('vm'),new Error(er.message==='tom_text'?'Det blev för lite text.':er.message))});
  };

/* ---- modell: allt räknas från riktig data ---- */
function dashModel(){
  var D=DSH.data,P=[],N=[];
  D.days.forEach(function(d){
    (d.passes||[]).forEach(function(p){var rpe=p.rpe==null?null:Number(p.rpe),mi=p.minutes==null?null:Number(p.minutes);
      P.push({n:dn(d.date),rpe:rpe,min:mi,load:(rpe!=null&&mi!=null)?rpe*mi:0,types:(p.types&&p.types.length?p.types:['annat']),pain:p.pain,loc:p.pain_location})});
    (d.notes||[]).forEach(function(n){N.push({n:dn(d.date),cat:n.category,note:n.note,type:n.type})});
  });
  var W=D.daily.map(function(x){return{n:dn(x.date),sleep_h:x.sleep_h==null?null:Number(x.sleep_h),sleep:x.sleep,energy:x.energy,soreness:x.soreness,stress:x.stress,weight:x.weight==null?null:Number(x.weight),pain:x.pain,loc:x.pain_location}});
  var all=P.map(function(p){return p.n}).concat(W.map(function(w){return w.n}));
  var first=all.length?Math.min.apply(null,all):null,last=all.length?Math.max.apply(null,all):null;
  return {P:P,N:N,W:W,first:first,last:last,today:dn(today())};
}
function dashSpan(M){var t=M.today;return M.first==null?0:t-M.first+1}
function dashRange(M){
  var r=DRNG.filter(function(x){return x[0]===DSH.range})[0];
  var from=(r&&r[2])?M.today-r[2]+1:(M.first==null?M.today:M.first);
  if(r&&r[2]&&M.first!=null&&from<M.first&&false)from=M.first;
  return {from:from,to:M.today,len:M.today-from+1,fixed:!!(r&&r[2])};
}
function dashPrev(R){return R.fixed?{from:R.from-R.len,to:R.from-1}:null}
function inR(n,a,b){return n>=a&&n<=b}
function dstats(M,a,b){
  var p=M.P.filter(function(x){return inR(x.n,a,b)}),rp=p.filter(function(x){return x.rpe!=null});
  var days={};p.forEach(function(x){days[x.n]=1});
  return{sessions:p.length,minutes:dsum(p.map(function(x){return x.min||0})),load:dsum(p.map(function(x){return x.load})),rpe:rp.length?dsum(rp.map(function(x){return x.rpe}))/rp.length:null,days:Object.keys(days).length};
}
function dbuckets(a,b){ // dagar om <=70, annars veckor (måndag)
  var B=[],len=b-a+1,weekly=len>70;
  if(!weekly){for(var n=a;n<=b;n++)B.push({a:n,b:n,l:dsh(n)})}
  else{var st=a-(((a+3)%7));/* 1970-01-01 var torsdag */for(var s=st;s<=b;s+=7)B.push({a:Math.max(s,a),b:Math.min(s+6,b),l:dsh(s)})}
  return {B:B,weekly:weekly};
}

function dcb(el){return{w:Math.max(el.clientWidth,60),h:Math.max(el.clientHeight,60)}}
function dnd(el,t){el.innerHTML='<div class="dnd">'+(t||'Ingen data för perioden')+'</div>'}
function dyAxis(L,T,iw,ih,mx,mn,fmt){var o='';for(var i=0;i<=4;i++){var y=T+ih-ih*i/4,v=mn+(mx-mn)*i/4;o+='<line x1="'+L+'" x2="'+(L+iw)+'" y1="'+y+'" y2="'+y+'" stroke="#1b3326"/><text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end">'+(fmt?fmt(v):d1(v))+'</text>'}return o}
function dbar(el,B,series,unit){
  var s=dcb(el),W=s.w,H=s.h,L=40,R=6,T=8,Bt=22,iw=W-L-R,ih=H-T-Bt;
  var tot=B.map(function(_,i){return dsum(series.map(function(x){return x.v[i]||0}))});
  if(!tot.some(function(v){return v>0}))return dnd(el);
  var mx=dniceMax(Math.max.apply(null,tot)),bw=iw/B.length,g=Math.min(bw*.22,6),o='<svg width="'+W+'" height="'+H+'">'+dyAxis(L,T,iw,ih,mx,0,function(v){return Math.round(v)});
  B.forEach(function(b,i){var y=T+ih,x=L+i*bw+g/2;series.forEach(function(se){var v=se.v[i]||0;if(v<=0)return;var h=ih*v/mx;y-=h;o+='<rect x="'+x+'" y="'+y+'" width="'+Math.max(bw-g,1)+'" height="'+h+'" fill="'+se.c+'"><title>'+esc(b.l+' · '+se.n+': '+Math.round(v)+(unit||''))+'</title></rect>'});});
  var step=Math.max(1,Math.ceil(52/bw));B.forEach(function(b,i){if(i%step===0)o+='<text x="'+(L+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(b.t||b.l)+'</text>'});
  el.innerHTML=o+'</svg>';
}
function dline(el,pts,opt){
  opt=opt||{};var s=dcb(el),W=s.w,H=s.h,L=opt.L||40,R=14,T=opt.vl&&opt.vl.length?22:10,Bt=22,iw=W-L-R,ih=H-T-Bt;
  pts=pts.filter(function(p){return p.y!=null&&!isNaN(p.y)});
  if(!pts.length)return dnd(el,opt.empty);
  var ys=pts.map(function(p){return p.y}).concat((opt.hl||[]).map(function(h){return h.y}));
  var mn=opt.min!=null?opt.min:Math.min.apply(null,ys),mx=opt.max!=null?opt.max:Math.max.apply(null,ys);
  if(opt.min==null||opt.max==null){var pad=(mx-mn)*.15||1;if(opt.min==null)mn-=pad;if(opt.max==null)mx+=pad}
  var x0=opt.x0,x1=opt.x1;if(x0==null){x0=Math.min.apply(null,pts.map(function(p){return p.x}));x1=Math.max.apply(null,pts.map(function(p){return p.x}))}
  if(x1<=x0)x1=x0+1;
  var X=function(x){return L+iw*(x-x0)/(x1-x0)},Y=function(y){return T+ih-ih*(y-mn)/(mx-mn)};
  var o='<svg width="'+W+'" height="'+H+'">'+dyAxis(L,T,iw,ih,mx,mn,opt.fmt);
  (opt.hl||[]).forEach(function(h){if(h.y<mn||h.y>mx)return;o+='<line x1="'+L+'" x2="'+(L+iw)+'" y1="'+Y(h.y)+'" y2="'+Y(h.y)+'" stroke="'+(h.c||'#fbbf24')+'" stroke-dasharray="5 4"/><text x="'+(L+iw-2)+'" y="'+(Y(h.y)-4)+'" text-anchor="end" style="fill:'+(h.c||'#fbbf24')+'">'+esc(h.t||'')+'</text>'});
  (opt.vl||[]).forEach(function(v){if(v.x<x0||v.x>x1)return;o+='<line x1="'+X(v.x)+'" x2="'+X(v.x)+'" y1="'+T+'" y2="'+(T+ih)+'" stroke="#fbbf24" stroke-dasharray="3 4"/><text x="'+X(v.x)+'" y="'+(T-6)+'" text-anchor="'+(X(v.x)>L+iw-50?'end':'middle')+'" style="fill:#fbbf24">'+esc(v.t)+'</text>'});
  var steps=Math.max(2,Math.min(6,Math.floor(iw/80)));for(var i=0;i<=steps;i++){var xv=x0+(x1-x0)*i/steps;o+='<text x="'+X(xv)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':i===steps?'end':'middle')+'">'+dsh(Math.round(xv))+'</text>'}
  var dpath=pts.map(function(p,i){return(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)}).join('');
  if(pts.length>1)o+='<path d="'+dpath+'" fill="none" stroke="'+(opt.c||'#34d399')+'" stroke-width="2.4" stroke-linejoin="round"/>';
  pts.forEach(function(p){o+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="'+(pts.length>60?2:3.5)+'" fill="'+(opt.c||'#34d399')+'"><title>'+esc(dsh(p.x)+': '+(opt.fmt?opt.fmt(p.y):d1(p.y))+(opt.unit||''))+'</title></circle>'});
  el.innerHTML=o+'</svg>';
}
function dline2(el,sa,sb,opt){ // två serier på samma axel
  var merged=sa.concat(sb);if(!merged.length)return dnd(el);

  var X=function(x){return L+iw*(x-opt.x0)/(opt.x1-opt.x0||1)},Y=function(y){return T+ih-ih*(y-mn)/(mx-mn)};
  var o='';if(sb.length>1)o+='<path d="'+sb.map(function(p,i){return(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)}).join('')+'" fill="none" stroke="'+opt.c2+'" stroke-width="2.4"/>';

function dchart(id){return '<div class="chart" data-c="'+id+'"></div>'}

function dlatest(){var a=DSH.data.analyses||[];return a[0]||null}
function dparse(x){if(!x)return null;try{return typeof x.summary==='string'?JSON.parse(x.summary):x.summary}catch(e){return null}}
function dtext(v){if(v==null)return '';if(typeof v==='string')return v;if(Array.isArray(v))return v.map(dtext).join(' ');if(typeof v==='object')return Object.keys(v).map(function(k){return dtext(v[k])}).join(' ');return String(v)}

function dashBuild(){
  var M=DSH.m=dashModel(),D=DSH.data;
  var span=dashSpan(M);
  var info=$('dinfo');
  info.innerHTML=M.first==null?'<b>Ingen träningsdata inlagd än</b>':'Riktig data · '+dsh(M.first)+' – '+dsh(M.last)+' · '+M.P.length+' pass · v3';
  var vis=DRNG.filter(function(r,i){return r[0]==='all'||span>(i?DRNG[i-1][2]:0)});
  if(vis.length>1&&vis[vis.length-2]&&vis[vis.length-2][2]>=span)vis.splice(vis.length-2,1);
  $('drng').innerHTML=vis.map(function(r){return '<button data-r="'+r[0]+'"'+(r[0]===DSH.range?' class="on"':'')+'>'+r[1]+'</button>'}).join('');
  if(vis.length<2)$('drng').innerHTML='';
  $('drng').onclick=function(e){var r=e.target.getAttribute('data-r');if(r){DSH.range=r;[].forEach.call($('drng').children,function(b){b.className=b.getAttribute('data-r')===r?'on':''});dashDraw()}};
  $('dtabs').innerHTML=DTABS.map(function(t){return '<button data-t="'+t[0]+'"'+(t[0]===DSH.tab?' class="on"':'')+'>'+t[1]+'</button>'}).join('');
  $('dtabs').onclick=function(e){var t=e.target.getAttribute('data-t');if(t){DSH.tab=t;[].forEach.call($('dtabs').children,function(b){b.className=b.getAttribute('data-t')===t?'on':''});dashShow()}};
  $('dmain').innerHTML=dashPanels(M);
  $('dmain').onclick=function(e){var h3=e.target.closest&&e.target.closest('.dcard>h3');if(h3&&dashMob()){h3.parentNode.classList.toggle('cl');dashDraw();return}var g=e.target.closest&&e.target.closest('[data-go]');if(g){DSH.tab=g.getAttribute('data-go');[].forEach.call($('dtabs').children,function(b){b.className=b.getAttribute('data-t')===DSH.tab?'on':''});dashShow()}
    var a=e.target.closest&&e.target.closest('[data-an]');if(a){DSH.an=Number(a.getAttribute('data-an'));dashAnalysis()}};
  dashShow();
}
function dashShow(){[].forEach.call(document.querySelectorAll('#dmain .panel'),function(p){p.className='panel'+(p.id==='p-'+DSH.tab?' on':'')});dashDraw()}

    ].map(function(c,k){return dcard(esc(c[0]),'','<div class="n">'+(k+1)+'</div><ul>'+c[1].map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>','cc')}).join('')+

function dashDraw(){try{dashDraw2()}catch(e){var m=document.getElementById('dinfo');if(m)m.innerHTML='<span style="color:#fbbf24">Fel i diagram: '+esc(e.message)+'</span>'}}
function dashDraw2(){
  var M=DSH.m;if(!M)return;var D=DSH.data,R=dashRange(M),Pv=dashPrev(R);
  var t=DSH.tab,P=M.P,A=R.from,Bz=R.to;
  var q=function(c){return document.querySelector('#dmain .panel.on [data-c="'+c+'"]')};
  var inr=function(x){return inR(x.n,A,Bz)};
  if(t==='overview'){
    var s=dstats(M,A,Bz),p=Pv?dstats(M,Pv.from,Pv.to):null;
    var dl=function(c,pv,inv){return p?ddelta(c,pv,'',inv):['','']};
    var w=M.W.filter(function(x){return inr(x)&&x.weight!=null});
    var d1l=dl(s.sessions,p&&p.sessions),d2=dl(s.minutes,p&&p.minutes),d3=dl(s.load,p&&p.load,true),d4=dl(s.rpe,p&&p.rpe,true);
    document.getElementById('kp').innerHTML=dkpi('Pass',s.sessions,'',d1l[0],d1l[1])+dkpi('Minuter',Math.round(s.minutes),'',d2[0],d2[1])+dkpi('Belastning',Math.round(s.load),'',d3[0],d3[1])+dkpi('Snitt-RPE',d1(s.rpe),'/ 10',d4[0],d4[1])+dkpi('Aktiva dagar',s.days,'av '+R.len,'')+dkpi('Senaste vikt',w.length?d1(w[w.length-1].weight):'–',w.length?'kg':'',w.length>1?(w[w.length-1].weight-w[0].weight>0?'+':'')+d1(w[w.length-1].weight-w[0].weight)+' kg sedan '+dsh(w[0].n):'');
    var bz=dbuckets(A,Bz);document.getElementById('bk1').textContent=bz.weekly?'vecka':'dag';
    var ks=[];P.filter(inr).forEach(function(x){x.types.forEach(function(k){if(ks.indexOf(k)<0)ks.push(k)})});
    var ser=ks.map(function(k){return{n:dtl(k),c:dtc(k),v:bz.B.map(function(b){return dsum(P.filter(function(x){return inR(x.n,b.a,b.b)}).map(function(x){return dsplit(x).filter(function(y){return y[0]===k}).reduce(function(a,y){return a+y[1]},0)}))})}});
    dbar(q('load'),bz.B,ser,' min');document.getElementById('lgd').innerHTML=dleg(ks);
    var lat=dlatest(),sm=lat&&dparse(lat),ai=sm&&sm.ai?sm.ai:null,ab=document.getElementById('aibox');
    if(DSH.data.analyses==null)ab.innerHTML='<p class="mut">Hämtar analys…</p>';else if(!lat)ab.innerHTML='<p class="mut">Ingen analys körd än. Kör en under Analys i fighterns sida.</p>';
    else{var main=ai&&(ai.sammanfattning||ai.summary);ab.innerHTML='<p>'+esc(dtext(main)||'Analysen saknar sammanfattning.')+'</p><div class="mut">'+esc((lat.label||'')+' · '+lat.period_from+' → '+lat.period_to)+'</div><button class="link" data-go="analysis">Öppna hela analysen →</button>'}
    var dpts=function(k,minv,maxv,c,cont){return M.W.filter(inr).filter(function(x){return x[k]!=null}).map(function(x){return{x:x.n,y:Number(x[k])}})};
    var lo={x0:A,x1:Bz,L:34};
    dline(q('sleep'),dpts('sleep_h'),Object.assign({c:'#60a5fa',unit:' h'},lo));
    dline(q('energy'),dpts('energy'),Object.assign({c:'#34d399',min:1,max:5},lo));
    dline(q('wt'),dpts('weight'),Object.assign({c:'#fbbf24',unit:' kg'},lo));
    dline2(q('ss'),dpts('soreness'),dpts('stress'),Object.assign({c:'#f97316',c2:'#a78bfa',min:1,max:5},lo));
  }
  if(t==='training'){
    var types={};P.filter(inr).forEach(function(x){dsplit(x).forEach(function(y){types[y[0]]=(types[y[0]]||0)+y[1]})});
    var tot=dsum(Object.keys(types).map(function(k){return types[k]}));
    dhbars(q('share'),Object.keys(types).sort(function(a,b){return types[b]-types[a]}).map(function(k){return{l:dtl(k),v:types[k],c:dtc(k),t:Math.round(types[k])+' min · '+Math.round(100*types[k]/tot)+' %'}}));
    var wb=dbuckets(A-(((A+3)%7)),Bz);wb.weekly=true;var B2=[];for(var s2=A-(((A+3)%7));s2<=Bz;s2+=7)B2.push({a:s2,b:s2+6,l:dsh(s2)+(s2+6>M.today?' · pågår':''),t:dsh(s2)+(s2+6>M.today?'*':'')});
    var ks2=[];P.filter(inr).forEach(function(x){x.types.forEach(function(k){if(ks2.indexOf(k)<0)ks2.push(k)})});
    dbar(q('wk'),B2,ks2.map(function(k){return{n:dtl(k),c:dtc(k),v:B2.map(function(b){return dsum(P.filter(function(x){return inR(x.n,b.a,b.b)}).map(function(x){return dsplit(x).filter(function(y){return y[0]===k}).reduce(function(a,y){return a+y[1]},0)}))})}}),' min');
    var rp=P.filter(inr).filter(function(x){return x.rpe!=null}),rpts;
    if(rp.length>60){rpts=B2.map(function(b){var v=rp.filter(function(x){return inR(x.n,b.a,b.b)});return v.length?{x:b.a+3,y:dsum(v.map(function(x){return x.rpe}))/v.length}:{x:b.a,y:null}});document.querySelector('#dmain .panel.on [data-c="rpe"]').parentNode.querySelector('.sub').textContent='skala 1–10, snitt per vecka'}
    else rpts=rp.map(function(x,i){return{x:x.n+(i%5)*.15,y:x.rpe}});
    dline(q('rpe'),rpts,{x0:A,x1:Bz,min:0,max:10,c:'#fbbf24',L:34});
    var ns=M.N.filter(inr).sort(function(a,b){return b.n-a.n}).slice(0,14);
    document.getElementById('nlist').innerHTML=ns.length?ns.map(function(n){return '<div class="nt"><b>'+dsh(n.n)+'</b> <span class="chip">'+esc(CN[n.cat]||n.cat||'')+'</span><div>'+esc(n.note)+'</div></div>'}).join(''):'<p class="mut">Inga anteckningar i perioden.</p>';
  }
  if(t==='body'){
    var wl={x0:A,x1:Bz,L:34},pp=function(k){return M.W.filter(inr).filter(function(x){return x[k]!=null}).map(function(x){return{x:x.n,y:Number(x[k])}})};
    dline(q('b_sleep'),pp('sleep_h'),Object.assign({c:'#60a5fa',unit:' h'},wl));
    dline(q('b_energy'),pp('energy'),Object.assign({c:'#34d399',min:1,max:5},wl));
    dline(q('b_sore'),pp('soreness'),Object.assign({c:'#f97316',min:1,max:5},wl));
    dline(q('b_stress'),pp('stress'),Object.assign({c:'#a78bfa',min:1,max:5},wl));
    var pains=M.W.filter(inr).filter(function(x){return x.pain}).sort(function(a,b){return b.n-a.n});
    document.getElementById('painlist').innerHTML=pains.length?pains.map(function(x){return '<div class="nt"><b>'+dsh(x.n)+'</b><div>'+esc(x.loc||'ingen plats angiven')+'</div></div>'}).join(''):'<p class="mut">Ingen angiven smärta i perioden.</p>';
  }
  if(t==='weight'){
    var ws=M.W.filter(function(x){return x.weight!=null}).sort(function(a,b){return a.n-b.n}),wr=ws.filter(inr);
    var ms=D.matches.map(function(m){return{n:dn(m.match_date),ev:m.event,opp:m.opponent,lim:m.weight_limit_kg==null?null:Number(m.weight_limit_kg),note:m.note}});
    var nextm=ms.filter(function(m){return m.n>=M.today}).sort(function(a,b){return a.n-b.n})[0];
    var hl=nextm&&nextm.lim!=null?[{y:nextm.lim,t:'viktgräns '+d1(nextm.lim)+' kg'}]:[];
    var vl=ms.filter(function(m){return m.n>=A&&m.n<=Bz+60}).map(function(m){return{x:m.n,t:m.ev||'match'}});
    var x1=Bz;vl.forEach(function(v){if(v.x>x1)x1=v.x});
    dline(q('wtbig'),wr.map(function(x){return{x:x.n,y:x.weight}}),{x0:A,x1:x1,c:'#fbbf24',unit:' kg',hl:hl,vl:vl,L:44,empty:'Ingen vikt inlagd för perioden'});
    var st=document.getElementById('wstats'),h='';
    if(wr.length){var lo2=Math.min.apply(null,wr.map(function(x){return x.weight})),hi=Math.max.apply(null,wr.map(function(x){return x.weight})),lastw=wr[wr.length-1];
      h+='<div class="stat"><span>Senaste</span><b>'+d1(lastw.weight)+' kg</b></div><div class="stat"><span>Första i perioden</span><b>'+d1(wr[0].weight)+' kg</b></div><div class="stat"><span>Lägst</span><b>'+d1(lo2)+' kg</b></div><div class="stat"><span>Högst</span><b>'+d1(hi)+' kg</b></div>';
      if(nextm&&nextm.lim!=null){var rem=lastw.weight-nextm.lim,dd=nextm.n-M.today;h+='<div class="stat"><span>Kvar till viktgräns</span><b>'+(rem>0?d1(rem)+' kg':'under gränsen')+'</b></div><div class="stat"><span>Dagar till match</span><b>'+dd+'</b></div>'}}
    else h='<p class="mut">Ingen vikt inlagd för perioden.</p>';
    st.innerHTML=h;
    document.getElementById('mlist').innerHTML=ms.length?ms.sort(function(a,b){return b.n-a.n}).map(function(m){var dd=m.n-M.today;return '<div class="nt"><b>'+dsh(m.n)+' '+dstr(m.n).slice(0,4)+'</b> <span class="chip">'+(dd>0?dd+' dagar kvar':dd===0?'idag':'för '+(-dd)+' dagar sedan')+'</span><div>'+esc([m.ev,m.opp?'mot '+m.opp:'',m.lim!=null?'gräns '+d1(m.lim)+' kg':''].filter(Boolean).join(' · '))+'</div>'+(m.note?'<div class="mut">'+esc(m.note)+'</div>':'')+'</div>'}).join(''):'<p class="mut">Ingen match inlagd.</p>';
  }
  if(t==='profile')dashProfile();
  if(t==='analysis')dashAnalysis();
  if(t==='layers'){var lg=document.getElementById('lgrid');if(!lg.getAttribute('data-done')){if(D.layers!=null)lg.setAttribute('data-done','1');lg.innerHTML=D.layers==null?'<p class="mut">Hämtar lager…</p>':(layersHtml(D.layers)||'<p class="mut">Inga lager att visa än.</p>')}}
}

function dashProfile(){
  var D=DSH.data,f=D.f,pr=D.profile||{},el=document.getElementById('p-profile');if(el.getAttribute('data-done'))return;el.setAttribute('data-done','1');
  var age=null;if(pr.fodd){var b=new Date(pr.fodd);if(!isNaN(b)){var n=new Date();age=n.getFullYear()-b.getFullYear()-((n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))?1:0)}}
  var facts=[['Ålder',age],['Viktklass',f.weight_class],['Stance',f.stance],['Rekord',f.fight_record],['Stil',f.primary_style],['Gym',pr.gym],['Började med MMA',pr.borjade_mma],['Hos dig sedan',pr.hos_mig_sedan],['Amatörrekord',pr.rek_amator],['Proffsrekord',pr.proffs?pr.rek_proffs:null],['Skada',f.injury_status],['Fokus',f.current_training_focus]].filter(function(x){return x[1]!=null&&x[1]!==''});
  var txt=PF.filter(function(x){return x[2]==='t'&&pr[x[0]]});
  if(f.general_strengths&&!pr.styrkor)txt.push(['styrkor','Styrkor']);
  var body=txt.map(function(x){return dcard(esc(x[1].replace(/ \(.*\)$/,'')),'','<p class="ptxt">'+esc(pr[x[0]]||f.general_strengths)+'</p>')}).join('');
  if(f.general_weaknesses&&!pr.svagheter)body+=dcard('Svagheter','','<p class="ptxt">'+esc(f.general_weaknesses)+'</p>');
  el.innerHTML='<div>'+dcard('Fakta','','<div class="facts">'+facts.map(function(x){return '<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>'}).join('')+'</div>')+'</div><div class="pgrid">'+(body||dcard('Profil','','<p class="mut">Ingen profiltext ifylld än.</p>'))+'</div>';
}
function dashAnalysis(){
  var a=DSH.data.analyses||[],i=DSH.an==null?0:DSH.an,L=document.getElementById('alist'),det=document.getElementById('adet');
  if(DSH.data.analyses==null){L.innerHTML='<p class="mut">Hämtar…</p>';det.innerHTML='';return}
  if(!a.length){L.innerHTML='<p class="mut">Inga analyser än.</p>';det.innerHTML='<p class="mut">Kör en analys under Fördjupad analys på fighterns sida.</p>';return}
  L.innerHTML=a.map(function(x,k){return '<button class="it'+(k===i?' on':'')+'" data-an="'+k+'"><span class="n">'+(k+1)+'</span><span class="t">'+esc((x.label||'Analys')+' · '+x.period_from+' → '+x.period_to)+'<br><small>körd '+esc(String(x.created_at).slice(0,10))+'</small></span></button>'}).join('');
  det.innerHTML=VZ.render(a[i].summary);
}
