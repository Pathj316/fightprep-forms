<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FightPrep – Coach</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--text:#14181f;--muted:#586272;--border:#d5dbe3;--accent:#c8102e;--accent-text:#fff;--ok:#167a43;--danger:#b42318;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0e1115;--surface:#171c23;--text:#eef1f5;--muted:#9aa5b4;--border:#2b3340;--accent:#e5384f;--ok:#4cc38a;--danger:#ff8a80;--chip:#212934}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.bar{max-width:760px;margin:0 auto;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:1rem;margin:0 auto 0 0}
.tab{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:9px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:14px 12px 70px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin:0 0 12px}
h2{font-size:1.1rem;margin:0 0 8px}h3{font-size:.98rem;margin:14px 0 6px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.88rem}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px;min-height:44px}
textarea{min-height:76px;resize:vertical}
.btn{border:0;border-radius:9px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:700;padding:0 14px;min-height:44px;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--text);border:1px solid var(--border);font-weight:600}
.btn.sm{min-height:36px;padding:0 10px;font-size:.88rem}.btn:disabled{opacity:.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 8px;font:inherit;color:var(--text);cursor:pointer}
.muted{color:var(--muted)}.small{font-size:.86rem}.err{color:var(--danger);font-weight:600}.ok{color:var(--ok);font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:700;background:var(--chip);border:1px solid var(--border);margin:0 4px 4px 0}
.note{border-left:3px solid var(--border);padding:4px 0 4px 10px;margin:8px 0}
.note q{display:block;color:var(--muted);font-size:.82rem;quotes:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gp h3{margin-top:16px}.gp ul{margin:4px 0 4px 18px;padding:0}
[hidden]{display:none!important}

/* VZ */
.vz-card{background:var(--surface,#fff);border:1px solid var(--border,#d5dbe3);border-left:4px solid var(--border,#d5dbe3);border-radius:12px;padding:14px;margin:0 0 12px}
.vz-card.good{border-left-color:#1f9d6b}.vz-card.work{border-left-color:#d99a06}.vz-card.warn{border-left-color:#d63a54}.vz-card.info{border-left-color:#4a7be0}
.vz-card h3{margin:0 0 8px;font-size:1.02rem}
.vz-card p{margin:0 0 8px}
.vz-h{margin:4px 0 10px;font-size:1.25rem}
.vz-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 6px}
.vz-tile{background:var(--surface,#fff);border:1px solid var(--border,#d5dbe3);border-radius:12px;padding:10px 12px}
.vz-l{font-size:.82rem;color:var(--muted,#586272)}
.vz-v{font-size:1.5rem;font-weight:700;line-height:1.2}.vz-v small{font-size:.8rem;font-weight:500;color:var(--muted,#586272)}
.vz-d{font-size:.78rem;color:var(--muted,#586272)}
.vz-note{font-size:.82rem;color:var(--muted,#586272);margin:6px 0 10px}
.vz-svg{width:100%;height:auto;display:block}
.vz-grid{stroke:var(--border,#d5dbe3);stroke-width:1}
.vz-ax{fill:var(--muted,#586272);font-size:9px}
.vz-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:2px 0 4px}
.vz-key{font-size:.8rem;display:inline-flex;align-items:center;gap:5px}.vz-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.vz-line{margin:0 0 10px}.vz-lh{display:flex;justify-content:space-between;font-size:.9rem}.vz-lh span{color:var(--muted,#586272)}
.vz-hb{display:grid;gap:6px}.vz-hr{display:grid;grid-template-columns:88px 1fr 44px;gap:8px;align-items:center;font-size:.9rem}
.vz-hbar{background:var(--chip,#eef1f5);border-radius:6px;height:12px;overflow:hidden}.vz-hbar i{display:block;height:100%}
.vz-pl{display:grid;gap:6px}.vz-pr{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;align-items:center;font-size:.88rem;padding:6px 0;border-top:1px solid var(--border,#d5dbe3)}
.vz-pd{font-weight:600}.vz-rpe{grid-column:1/3;background:var(--chip,#eef1f5);border-radius:6px;height:8px;overflow:hidden;display:block}.vz-rpe i{display:block;height:100%;background:var(--accent,#c8102e)}.vz-pm{grid-column:1/3;color:var(--muted,#586272);font-size:.8rem}
.vz-tag{display:inline-block;border:1px solid;border-radius:99px;padding:0 8px;font-size:.78rem;margin:0 4px 2px 0}
.vz-it{padding:8px 0 8px 10px;border-left:3px solid var(--border,#d5dbe3);margin:0 0 8px}.vz-it.good{border-left-color:#1f9d6b}.vz-it.work{border-left-color:#d99a06}.vz-it.warn{border-left-color:#d63a54}.vz-it.info{border-left-color:#4a7be0}
.vz-why{font-size:.86rem;color:var(--muted,#586272);margin-top:2px}
.vz-chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:700;color:#fff;background:#4a7be0;margin:0 0 6px}.vz-chip.good{background:#1f9d6b}.vz-chip.warn{background:#d63a54}.vz-chip.work{background:#d99a06}
.vz-sc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 8px}
.vz-t{border-collapse:collapse;width:100%;font-size:.86rem}.vz-t th,.vz-t td{border-bottom:1px solid var(--border,#d5dbe3);padding:6px 8px;text-align:left;vertical-align:top}
.vz-team th[scope=row]{position:sticky;left:0;background:var(--surface,#fff);white-space:nowrap;z-index:1}
.vz-c{white-space:nowrap}.vz-c.ok{background:rgba(31,157,107,.16)}.vz-c.mid{background:rgba(217,154,6,.22)}.vz-c.bad{background:rgba(214,58,84,.24)}.vz-c.info{background:rgba(74,123,224,.16)}.vz-c.na{color:var(--muted,#586272)}
.vz-s{font-weight:700}
.vz-sw{padding:1px 6px;border-radius:6px}.vz-sw.ok{background:rgba(31,157,107,.16)}.vz-sw.mid{background:rgba(217,154,6,.22)}.vz-sw.bad{background:rgba(214,58,84,.24)}
.vz-legacy{line-height:1.5}

.vz-card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.vz-card>summary::-webkit-details-marker{display:none}
.vz-card>summary::after,.vz-sub>summary::after{content:'▾';color:var(--muted,#586272);transition:transform .15s}
.vz-card:not([open])>summary::after,.vz-sub:not([open])>summary::after{transform:rotate(-90deg)}
.vz-card>summary h3{margin:0}
.vz-body{margin-top:10px}
.vz-sub{border-top:1px solid var(--border,#d5dbe3);padding:8px 0}
.vz-sub>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;min-height:30px;align-items:center}
.vz-sub>summary::-webkit-details-marker{display:none}
.vz-sub .vz-body{margin-top:6px}
.vz-sub.work{border-left:3px solid #d99a06;padding-left:8px}
.vz-tg{margin:0 0 10px;text-align:right}
.vz-btn{background:transparent;border:1px solid var(--border,#d5dbe3);color:inherit;border-radius:8px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;min-height:36px}
.vz-card p+p{margin-top:8px}
</style>
</head>
<body>
<header><div class="bar"><h1>FightPrep</h1>
<nav id="tabs" class="row" hidden>
<button class="tab" data-tab="fighters">Fighters</button>
<button class="tab" data-tab="sum">Sammanställning</button>
<button class="tab" data-tab="opps">Motståndare</button>
<button class="tab" data-tab="matches">Matcher</button>
<button class="tab" id="logout">Logga ut</button></nav></div></header>
<main id="app"></main>
<script>
(function(){
'use strict';
var URL_='https://rgsbhkqwmilragkiogkr.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnc2Joa3F3bWlscmFna2lvZ2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxOTk3MzQsImV4cCI6MjA4MDc3NTczNH0.cCtGnUwa3ynQNDUIYhhhXT6vT04MeaM1mn3flHgFEEU';
var CATS=[['striking','Striking'],['grappling','Grappling'],['wrestling','Brottning'],['wall_wrestling','Väggbrottning'],['overall_game','Helhet'],['physical','Fysik'],['mental','Mentalt'],['fight_performance','Matchprestation']];
var CN={};CATS.forEach(function(c){CN[c[0]]=c[1]});
var SRC=[['match','Match'],['sparring','Sparring'],['training_clip','Träningsklipp'],['network','Nätverk']];
var CONF=[['established_pattern','Etablerat mönster'],['single_observation','Enstaka observation'],['coach_guess','Coachens gissning']];
var S={token:null,refresh:null,exp:0,tab:'fighters',view:null,archetypes:[],questions:[],date:today0(),type:'grappling',sumId:'',sumDays:28};
function today0(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
var app=document.getElementById('app'),tabs=document.getElementById('tabs');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function opts(list,sel,blank){return(blank?'<option value="">'+esc(blank)+'</option>':'')+list.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===sel?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')}
function nz(v){v=(v==null?'':String(v)).trim();return v===''?null:v}
function num(v){v=nz(v);return v==null?null:Number(v)}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

/* auth */
function authCall(path,body){return fetch(URL_+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||'Inloggning misslyckades');return j})})}
function setSession(j){S.token=j.access_token;S.refresh=j.refresh_token;S.exp=Date.now()+((j.expires_in||3600)-60)*1000;ls('fp3_rt',S.refresh)}
function ensure(){if(S.token&&Date.now()<S.exp)return Promise.resolve();if(!S.refresh)return Promise.reject(new Error('Inte inloggad'));return authCall('token?grant_type=refresh_token',{refresh_token:S.refresh}).then(setSession).catch(function(){logout('Sessionen gick ut – logga in igen');throw new Error('Sessionen gick ut')})}
function api(path,body){return ensure().then(function(){return fetch(URL_+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:JSON.stringify(body||{})})}).then(function(r){return r.json().catch(function(){return null}).then(function(j){if(!r.ok)throw new Error((j&&(j.message||j.error))||('Fel '+r.status));return j})})}
function rpc(fn,b){return api('/rest/v1/rpc/'+fn,b)}
function logout(msg){S.token=null;S.refresh=null;ls('fp3_rt',null);login(msg)}
$('logout').onclick=function(){logout()};

function login(msg){
  tabs.hidden=true;
  app.innerHTML='<div class="card" style="max-width:380px;margin:28px auto"><h2>Logga in</h2><form id="lf"><label for="em">E-post</label><input id="em" type="email" autocomplete="username" required><label for="pw">Lösenord</label><input id="pw" type="password" autocomplete="current-password" required><p class="err" id="le" role="alert">'+esc(msg||'')+'</p><button class="btn" style="width:100%">Logga in</button></form><p class="small" style="margin-top:14px"><a href="#" id="fg">Första gången / glömt lösenord</a></p></div>';
  $('fg').onclick=function(e){e.preventDefault();recoverForm()};
  $('lf').onsubmit=function(e){e.preventDefault();$('le').textContent='';authCall('token?grant_type=password',{email:$('em').value.trim(),password:$('pw').value}).then(function(j){setSession(j);return boot()}).catch(function(er){$('le').textContent=er.message})};
}
function boot(){
  return rpc('fp2_coach_whoami').then(function(w){
    if(!w||!w.coach){logout('Kontot saknar coach-behörighet.');return}
    return Promise.all([rpc('fp3_list_archetypes'),rpc('fp2_coach_questions')]).then(function(r){S.archetypes=r[0]||[];S.questions=r[1]||[];tabs.hidden=false;S.view=null;render()});
  });
}
tabs.onclick=function(e){var t=e.target.getAttribute('data-tab');if(t){S.tab=t;S.view=null;render()}};

function render(){
  Array.prototype.forEach.call(tabs.querySelectorAll('[data-tab]'),function(b){b.setAttribute('aria-selected',b.getAttribute('data-tab')===(S.tab==='pass'?'fighters':S.tab))});
  if(S.tab==='pass')passView();
  else if(S.tab==='sum')sumView();
  else if(S.tab==='fighters')S.view?fighterView(S.view):fighterList();
  else if(S.tab==='opps')S.view?oppView(S.view):oppList();
  else S.view?matchView(S.view):matchList();
}
function fail(el,er){el.className='small err';el.textContent=er.message||String(er)}
function top(btnId,label,fn){return '<button class="btn sec sm" id="'+btnId+'">← '+label+'</button>'}

/* ---------- Fighters ---------- */
function fighterList(){
  app.innerHTML='<div class="row" style="justify-content:space-between"><h2>Fighters</h2><div class="row"><button class="btn sec sm" id="imp">Hämta från mina profiler</button><button class="btn sm" id="nf">+ Ny</button></div></div><p id="im" class="small"></p><div id="l"><p class="muted">Laddar…</p></div><h2 style="margin-top:18px">Laget</h2><div class="card"><h3 style="margin:0 0 6px">Lagpass</h3><p class="small muted">Fyll i vad hela gruppen gjorde, vilka som var där och intensiteten. Fighter-anteckningar lägger du under respektive fighter.</p><button class="btn sec" id="lp">Öppna lagpass</button></div><div class="card" id="wn"></div><div class="card" id="tm"><p class="muted small">Laddar lagsanalys…</p></div>';
  $('lp').onclick=function(){S.tab='pass';S.view=null;render()};weekNote();
  $('nf').onclick=function(){fighterEdit(null)};
  teamCard();
  $('imp').onclick=function(){if(!confirm('Skapa fighters från dina klubbprofiler? Fighters du raderat skapas då om. Använd bara första gången.'))return;rpc('fp3_import_profiles').then(function(r){$('im').className='small ok';$('im').textContent=(r&&r.imported||0)+' fighters hämtade och kopplade till dina lager.';fighterList()}).catch(function(er){fail($('im'),er)})};
  rpc('fp3_list_fighters').then(function(a){a=a||[];$('l').innerHTML=a.map(function(f){return '<div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><button class="item" style="margin:0;flex:1" data-id="'+esc(f.id)+'"><b>'+esc(f.name)+'</b> <span class="muted small">'+esc(f.weight_class||'')+'</span>'+(f.injury_status?' <span class="pill">'+esc(f.injury_status)+'</span>':'')+'</button><button class="btn sec sm" data-del="'+esc(f.id)+'" data-nm="'+esc(f.name)+'" aria-label="Radera '+esc(f.name)+'">🗑</button></div>'}).join('')||'<p class="muted">Inga fighters.</p>';
    $('l').onclick=function(e){var d=e.target.closest('[data-del]');if(d){if(confirm('Radera '+d.getAttribute('data-nm')+'? Allt kopplat (incheckningar, anteckningar, länkar, matcher) försvinner. Går inte att ångra.'))rpc('fp3_delete_fighter',{p_id:d.getAttribute('data-del')}).then(fighterList).catch(function(er){alert(er.message)});return}var b=e.target.closest('[data-id]');if(b){S.view=b.getAttribute('data-id');render()}}}).catch(function(er){fail($('l'),er)});
}
function teamCard(){
  var box=$('tm');if(!box)return;
  rpc('fp3_list_team_analyses').then(function(a){a=a||[];
    box.innerHTML='<h3 style="margin:0 0 6px">Lagsanalys</h3><p class="small muted">Alla fighters på en gång: belastning, skador, mående, teman och vad som behöver följas upp. Kör när du vill.</p>'+
     '<label for="tp">Period</label><select id="tp"><option value="7">Senaste 7 dagarna</option><option value="30" selected>Senaste 30 dagarna</option><option value="90">Senaste 3 månaderna</option><option value="365">Senaste året</option><option value="all">Allt som finns</option><option value="custom">Eget intervall…</option></select>'+
     '<div id="tc" class="g2" hidden><div><label for="tf">Från</label><input id="tf" type="date"></div><div><label for="tt">Till</label><input id="tt" type="date" value="'+today()+'"></div></div>'+
     '<p id="tmsg" class="small"></p><button class="btn" id="tb">Analysera laget</button><div style="margin-top:12px">'+
     (a.map(function(x,i){return VZ.hist((x.label||'')+' · '+x.period_from+' → '+x.period_to+' · körd '+String(x.created_at).slice(0,10),x.summary,i===0)}).join('')||'<p class="muted small">Inga lagsanalyser än.</p>')+'</div>';
    $('tp').onchange=function(){$('tc').hidden=this.value!=='custom'};
    $('tb').onclick=function(){var v=$('tp').value,to=today(),from,lab=$('tp').options[$('tp').selectedIndex].text;
      if(v==='custom'){from=$('tf').value;to=$('tt').value;lab='Eget intervall';if(!from||!to){fail($('tmsg'),new Error('Välj från- och tilldatum'));return}}
      else if(v==='all'){from='2015-01-01'}
      else{var d=new Date();d.setDate(d.getDate()-Number(v));from=iso(d)}
      var b=$('tb');b.disabled=true;b.textContent='Analyserar… (kan ta en minut)';$('tmsg').textContent='';
      api('/functions/v1/coach_team_analysis',{from:from,to:to,label:lab}).then(function(){teamCard()}).catch(function(er){b.disabled=false;b.textContent='Analysera laget';fail($('tmsg'),new Error(er.message==='ingen_data'?'Inget inlagt under den perioden.':er.message))})};
  }).catch(function(er){fail(box,er)});
}
var WC=[['flyweight','Flugvikt'],['bantamweight','Bantamvikt'],['featherweight','Fjädervikt'],['lightweight','Lättvikt'],['welterweight','Weltervikt'],['middleweight','Mellanvikt'],['light_heavyweight','Lätt tungvikt'],['heavyweight','Tungvikt'],['womens_strawweight','Dam: Stråvikt'],['womens_flyweight','Dam: Flugvikt'],['womens_bantamweight','Dam: Bantamvikt']];
var STANCES=[['orthodox','Orthodox'],['southpaw','Southpaw'],['switch','Växlar (switch)']];
var STYLES=[['Allround','Allround'],['Brottare','Brottare'],['Grappler','Grappler'],['Striker','Striker']];
var FF=[['name','Namn'],['weight_class','Viktklass','s',WC],['stance','Stance','s',STANCES],['height_cm','Längd (cm)','n'],['reach_cm','Räckvidd (cm)','n'],['primary_style','Stil','s',STYLES]];
function selField(x,v){
  var cur=String(v==null?'':v),low=cur.toLowerCase().replace(/ /g,'_'),list=x[3],hit=null;
  list.forEach(function(o){if(o[0].toLowerCase()===low||o[1].toLowerCase()===cur.toLowerCase())hit=o[0]});
  var h='<option value="">Välj…</option>'+list.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===hit?' selected':'')+'>'+esc(o[1])+'</option>'}).join('');
  if(cur&&!hit)h+='<option value="'+esc(cur)+'" selected>'+esc(cur)+' (nuvarande)</option>';
  return '<select id="f_'+x[0]+'">'+h+'</select>';
}
function profFields(d){

function passView(){
  if(!COMBAT.some(function(c){return c[0]===S.type}))S.type='mma';
  app.innerHTML='<div class="row" style="justify-content:space-between"><button class="btn sec sm" id="pbk">← Fighters</button></div><h2>Lagpass</h2><div class="card"><div class="g2"><div><label for="pd">Datum</label><input type="date" id="pd" value="'+esc(S.date)+'"></div><div><label for="pt">Passtyp</label><select id="pt">'+opts(COMBAT,S.type)+'</select></div></div><p class="small muted">Du fyller bara i de kampsportspass du är på. Missade du dagen kan du lägga in anteckningar i efterhand, eller hoppa över den.</p></div><div class="card" id="vc"></div><div id="pl"><p class="muted">Laddar…</p></div><div class="card" id="wn"></div>';

function weekNote(){
  var box=$('wn');if(!box)return;
  rpc('fp6_week_note_get',{p_week:S.date}).then(function(r){
    box.innerHTML='<h3 style="margin:0 0 6px">Veckans helhetsbild</h3><p class="small muted">Vecka från '+esc(r.week_start)+'. Vad var bäst, vad oroar dig, vem behöver extra uppmärksamhet. Gör gärna på söndagen.</p><textarea id="wnt">'+esc(r.note||'')+'</textarea><p id="wnm" class="small"></p><button class="btn sm" id="wns">Spara veckobild</button>';
    $('wns').onclick=function(){var m=$('wnm');m.className='small muted';m.textContent='Sparar…';rpc('fp6_week_note_save',{p_week:S.date,p_note:$('wnt').value}).then(function(){m.className='small ok';m.textContent='Sparat'}).catch(function(er){fail(m,er)})};
  }).catch(function(er){fail(box,er)});

function voiceCard(cfg){
  cfg=cfg||{};var box=$(cfg.box||'vc');if(!box)return;
  function VD(){return cfg.date?cfg.date():S.date}function VT(){return cfg.type?cfg.type():S.type}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,on=false,base='',FL=[];
  box.innerHTML='<h3 style="margin:0 0 6px">Prata in passet</h3><p class="small muted">Tryck på mikrofonen och prata fritt om passet och fighterna. AI:n sorterar det i rätt fält. Inget sparas förrän du godkänner.</p>'+
    (SR?'<div class="row" style="margin-bottom:8px"><button class="btn" id="vmic" type="button">🎙️ Spela in</button></div>':'<p class="small muted">Den här webbläsaren har ingen inbyggd röstigenkänning. Använd mikrofonen på tangentbordet i rutan nedan i stället.</p>')+
    '<textarea id="vt" style="min-height:110px" placeholder="Det du säger hamnar här. Du kan rätta, skriva eller använda tangentbordets mikrofon."></textarea><p id="vm" class="small"></p><button class="btn sec" id="vsort" type="button">Sortera med AI</button><div id="vr"></div>';
  function stop(){on=false;if(rec){try{rec.stop()}catch(e){}}var b=$('vmic');if(b){b.textContent='🎙️ Spela in';b.classList.remove('danger')}}
  if(SR){
    $('vmic').onclick=function(){
      if(on){stop();return}
      rec=new SR();rec.lang='sv-SE';rec.continuous=true;rec.interimResults=true;base=$('vt').value?$('vt').value.replace(/\s*$/,' '):'';
      rec.onresult=function(e){var interim='';for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i];if(r.isFinal)base+=r[0].transcript.trim()+' ';else interim+=r[0].transcript}$('vt').value=base+interim};
      rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){stop();fail($('vm'),new Error('Mikrofonen är inte tillåten i webbläsaren.'))}};
      rec.onend=function(){if(on){try{rec.start()}catch(e){stop()}}};
      try{rec.start();on=true;this.textContent='⏹ Stoppa inspelningen';$('vm').textContent=''}catch(e){fail($('vm'),e)}
    };
  }
  function fsel(id){return '<select data-pf>'+'<option value="">Välj fighter…</option>'+FL.map(function(f){return '<option value="'+esc(f.id)+'"'+(f.id===id?' selected':'')+'>'+esc(f.name)+'</option>'}).join('')+'</select>'}
  function nm(id){var f=FL.filter(function(x){return x.id===id})[0];return f?f.name:'?'}
  function review(r){
    if(cfg.fixed){r.focus=null;r.standout=null;r.intensity=null;r.attendees=[];r.week_note=null}
    var cur={f:$('sf')?$('sf').value:'',s:$('ss')?$('ss').value:'',i:$('si')?$('si').value:''};
    var focus=r.focus||cur.f,stand=(cur.s&&r.standout)?cur.s+' '+r.standout:(r.standout||cur.s),inten=r.intensity||cur.i;
    var h='<div style="margin-top:12px"><h3 style="margin:0 0 6px">Kontrollera innan det sparas</h3><p class="small muted">Rätta det som är fel och avmarkera det du inte vill spara.</p>';
    if(r.focus||r.standout||r.intensity)h+='<div class="note"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rp" checked> <b>Passinfo</b></label><label>Vad gick passet ut på?</label><textarea id="rpf" style="min-height:50px">'+esc(focus)+'</textarea><label>Intensitet (1–5)</label><select id="rpi"><option value="">Hoppa över</option>'+[1,2,3,4,5].map(function(n){return '<option value="'+n+'"'+(+inten===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select><label>Något som sticker ut?</label><textarea id="rps" style="min-height:50px">'+esc(stand)+'</textarea>'+(r.attendees.length?'<div class="small muted" style="margin-top:6px">Markeras som närvarande: '+r.attendees.map(function(a){return esc(nm(a))}).join(', ')+'</div>':'')+'</div>';
    h+=r.notes.map(function(n,i){return '<div class="note" data-rn="'+i+'"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-on checked> <b>Anteckning</b></label>'+fsel(n.fighter_id)+'<select data-pc style="margin-top:6px">'+opts(CATS,n.category)+'</select><textarea data-pt style="margin-top:6px;min-height:50px">'+esc(n.text)+'</textarea></div>'}).join('');
    h+=r.flags.map(function(f,i){return '<div class="note" data-rf="'+i+'"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-on checked> <b>Flagga:</b> '+esc(nm(f.fighter_id))+' – '+esc(FN[f.flag]||f.flag)+'</label></div>'}).join('');
    if(r.week_note)h+='<div class="note"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="rwc" checked> <b>Veckans helhetsbild</b> (läggs till under den du har)</label><textarea id="rwt" style="min-height:50px">'+esc(r.week_note)+'</textarea></div>';
    if(r.oklart.length)h+='<div class="note"><b>Kunde inte placeras:</b><ul>'+r.oklart.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
    h+='<p id="rsm" class="small"></p><button class="btn" id="rsave" type="button">Spara valda</button></div>';
    $('vr').innerHTML=h;
    $('rsave').onclick=function(){
      var b=this,m=$('rsm'),steps=[],bad=false;
      if($('rp')&&$('rp').checked){var att=[];Array.prototype.forEach.call(document.querySelectorAll('[data-att]'),function(c){if(c.checked)att.push(c.getAttribute('data-att'))});r.attendees.forEach(function(a){if(att.indexOf(a)<0)att.push(a)});
        steps.push(function(){return rpc('fp6_session_save',{p_date:VD(),p_type:VT(),p_focus:$('rpf').value,p_intensity:$('rpi').value?+$('rpi').value:null,p_standout:$('rps').value,p_attendees:att})})}
      Array.prototype.forEach.call($('vr').querySelectorAll('[data-rn]'),function(d){if(!d.querySelector('[data-on]').checked)return;var fid=d.querySelector('[data-pf]').value,t=nz(d.querySelector('[data-pt]').value);if(!fid||!t){bad=true;return}
        steps.push(function(){return rpc('fp2_coach_add_note',{p_fighter_id:fid,p_date:VD(),p_type:VT(),p_category:d.querySelector('[data-pc]').value,p_question:null,p_note:t})})});
      Array.prototype.forEach.call($('vr').querySelectorAll('[data-rf]'),function(d){if(!d.querySelector('[data-on]').checked)return;var f=r.flags[+d.getAttribute('data-rf')];steps.push(function(){return rpc('fp6_set_flag',{p_date:VD(),p_type:VT(),p_fighter_id:f.fighter_id,p_flag:f.flag})})});
      if($('rwc')&&$('rwc').checked)steps.push(function(){return rpc('fp6_week_note_get',{p_week:VD()}).then(function(w){var old=(w&&w.note)||'';return rpc('fp6_week_note_save',{p_week:VD(),p_note:(old?old+'\n\n':'')+$('rwt').value})})});
      if(bad){fail(m,new Error('Välj fighter och skriv text för varje markerad anteckning, eller avmarkera den.'));return}
      if(!steps.length){fail(m,new Error('Inget är markerat.'));return}
      b.disabled=true;m.className='small muted';m.textContent='Sparar…';
      steps.reduce(function(p,s){return p.then(s)},Promise.resolve()).then(function(){$('vt').value='';$('vr').innerHTML='<p class="small ok">Sparat. Det syns nu i passvyn nedan.</p>';(cfg.after?cfg.after():(loadPass(),weekNote()))}).catch(function(er){b.disabled=false;fail(m,er)});
    };
  }
  $('vsort').onclick=function(){
    stop();var t=nz($('vt').value);if(!t){fail($('vm'),new Error('Prata in eller skriv något först.'));return}
    var b=this;b.disabled=true;b.textContent='Sorterar…';$('vm').textContent='';$('vr').innerHTML='';
    (cfg.fixed?Promise.resolve(cfg.fixed):rpc('fp3_list_fighters')).then(function(a){FL=(a||[]).map(function(f){return{id:f.id,name:f.name}});return api('/functions/v1/coach_voice_sort',{text:t,fighters:FL,date:VD(),type:VT(),fixed:!!cfg.fixed})}).then(function(r){b.disabled=false;b.textContent='Sortera med AI';review(r)}).catch(function(er){b.disabled=false;b.textContent='Sortera med AI';fail($('vm'),new Error(er.message==='tom_text'?'Det blev för lite text.':er.message))});
  };
}
function noteH(n){return '<div class="note"><q>'+esc((CN[n.category]||n.category)+(n.question?' – '+n.question:''))+'</q>'+esc(n.note)+' <button class="btn sec sm" data-rm="'+esc(n.id)+'">Ta bort</button></div>'}
function ciHtml(r){
  var h='';
  (r.checkins||[]).forEach(function(c){
    h+='<div class="small" style="margin-bottom:6px">'+(c.types||[]).map(function(t){return '<span class="pill">'+esc(TN[t]||t)+'</span>'}).join('')+chip('RPE',c.rpe)+(c.minutes?'<span class="pill">'+esc(c.minutes)+' min</span>':'')+(c.pain?'<span class="pill" style="color:var(--danger)">Värk'+(c.pain_location?': '+esc(c.pain_location):'')+'</span>':'')+(c.did?'<div><b>Gjorde:</b> '+esc(c.did)+'</div>':'')+(c.felt?'<div><b>Kändes:</b> '+esc(c.felt)+'</div>':'')+'</div>';
  });

  if(d)h+='<div class="small muted">Morgonkoll: sömn '+esc(d.sleep)+'/5 · energi '+esc(d.energy)+'/5 · ömhet '+esc(d.soreness)+'/5 · stress '+esc(d.stress)+'/5'+(d.pain?' · värk'+(d.pain_location?': '+esc(d.pain_location):''):'')+'</div>';
  return h||'<span class="muted small">Ingen incheckning från fightern.</span>';

function loadPass(){
  var box=$('pl');
  rpc('fp6_session_load',{p_date:S.date,p_type:S.type}).then(function(res){
    var rows=(res&&res.fighters)||[],sm=res&&res.summary||{},att=sm.attendees||[];
    if(!rows.length){box.innerHTML='<p class="muted">Inga fighters.</p>';return}
    var hasSaved=!!res.summary;
    var present=function(r){return hasSaved?att.indexOf(r.fighter_id)>=0:(r.checkins&&r.checkins.length>0)};
    var h='<div class="card"><h3 style="margin:0 0 6px">Passet</h3>'+
      '<label for="sf">Vad gick passet ut på?</label><textarea id="sf" style="min-height:60px">'+esc(sm.focus||'')+'</textarea>'+
      '<label for="si">Intensitet och nivå i gruppen (1–5)</label><select id="si"><option value="">Hoppa över</option>'+[1,2,3,4,5].map(function(n){return '<option value="'+n+'"'+(sm.intensity===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select>'+
      '<label for="ss">Något som sticker ut?</label><textarea id="ss" style="min-height:60px" placeholder="Skada, bra framsteg, någon som tappade…">'+esc(sm.standout||'')+'</textarea>'+
      '<label>Vilka var här?</label><div id="sa">'+rows.map(function(r){return '<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-att="'+esc(r.fighter_id)+'"'+(present(r)?' checked':'')+'> '+esc(r.name)+'</label>'}).join('')+'</div>'+
      '<p id="sm" class="small"></p><button class="btn" id="sv">Spara pass</button></div>';
    h+=rows.map(function(r,i){var notes=r.notes||[];
      return '<details class="card" '+(present(r)||notes.length?'open':'')+'><summary><b>'+esc(r.name)+'</b>'+(r.flag?' <span class="pill" style="color:var(--danger)">'+esc(FN[r.flag]||r.flag)+'</span>':'')+(notes.length?' <span class="pill ok">'+notes.length+' anteckn.</span>':'')+((r.checkins||[]).length?' <span class="pill">incheckad</span>':'')+'</summary>'+
       '<div style="margin:8px 0">'+ciHtml(r)+'</div>'+
       '<label>Flagga</label><select data-fl="'+i+'">'+opts(FLAGS,r.flag||'')+'</select><span data-fm="'+i+'" class="small"></span>'+
       '<div>'+notes.map(noteH).join('')+'</div>'+
       '<label>Anteckning</label><select data-q="'+i+'">'+CQ.map(function(q,qi){return '<option value="'+qi+'">'+esc(q[0])+'</option>'}).join('')+'<option value="free">Fri anteckning</option></select>'+
       '<div data-cw="'+i+'" hidden><label>Kategori</label><select data-c="'+i+'">'+opts(CATS,'striking')+'</select></div>'+
       '<textarea data-t="'+i+'" style="margin-top:8px" placeholder="Skriv fritt (valfritt)…"></textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-add="'+i+'">Spara anteckning</button><span data-m="'+i+'" class="small"></span></div></details>'}).join('');
    box.innerHTML=h;
    $('sv').onclick=function(){var a=[];Array.prototype.forEach.call(box.querySelectorAll('[data-att]'),function(c){if(c.checked)a.push(c.getAttribute('data-att'))});var m=$('sm');m.className='small muted';m.textContent='Sparar…';
      rpc('fp6_session_save',{p_date:S.date,p_type:S.type,p_focus:$('sf').value,p_intensity:$('si').value?+$('si').value:null,p_standout:$('ss').value,p_attendees:a}).then(function(){m.className='small ok';m.textContent='Sparat'}).catch(function(er){fail(m,er)})};
    box.onchange=function(e){var t=e.target,q=t.getAttribute('data-q'),f=t.getAttribute('data-fl');
      if(q!==null)box.querySelector('[data-cw="'+q+'"]').hidden=t.value!=='free';
      if(f!==null){var fm=box.querySelector('[data-fm="'+f+'"]');fm.className='small muted';fm.textContent=' sparar…';rpc('fp6_set_flag',{p_date:S.date,p_type:S.type,p_fighter_id:rows[+f].fighter_id,p_flag:t.value||null}).then(function(){fm.className='small ok';fm.textContent=' sparad'}).catch(function(er){fail(fm,er)})}};
    box.onclick=function(e){var a=e.target.getAttribute('data-add'),d=e.target.getAttribute('data-rm');
      if(a!==null){a=+a;var sel=box.querySelector('[data-q="'+a+'"]'),ta=box.querySelector('[data-t="'+a+'"]'),m=box.querySelector('[data-m="'+a+'"]'),t=nz(ta.value);if(!t){fail(m,new Error('Skriv något först'));return}
        var cat,q=null;if(sel.value==='free'){cat=box.querySelector('[data-c="'+a+'"]').value}else{var qq=CQ[+sel.value];cat=qq[1];q=qq[2]}
        m.className='small muted';m.textContent='Sparar…';
        rpc('fp2_coach_add_note',{p_fighter_id:rows[a].fighter_id,p_date:S.date,p_type:S.type,p_category:cat,p_question:q,p_note:t}).then(loadPass).catch(function(er){fail(m,er)})}

function kv(o,keys){return keys.map(function(k){return o&&o[k]!=null?'<div class="small"><b>'+esc(k.replace(/_/g,' '))+':</b> '+(typeof o[k]==='object'?esc(JSON.stringify(o[k])):esc(o[k]))+'</div>':''}).join('')}
function pct(v){return v==null?'–':Math.round(Number(v)*100)+'%'}
function layersHtml(L){
  if(!L||!L.poster)return '';
  var g={},order=[];
  L.poster.forEach(function(r){if(!g[r.g]){g[r.g]=[];order.push(r.g)}g[r.g].push(r)});
  var LC={'låg':'#1f9d6b','medel':'#d99a06','hög':'#d63a54'};
  return order.map(function(k){return '<div class="card"><h3 style="margin-top:0">'+esc(k)+'</h3>'+g[k].map(function(r){
    var t=String(r.t||''),pre=r.l+': ';if(t.indexOf(pre)===0)t=t.slice(pre.length);
    var bar=(r.lvl&&r.v!=null)?'<div class="vz-hbar" style="margin:4px 0" title="skala 0 till 1"><i style="width:'+Math.max(2,Math.round(r.v*100))+'%;background:'+(LC[r.lvl]||'#8793a3')+'"></i></div>':'';
    return '<div class="vz-it'+(r.lvl==='hög'?' warn':r.lvl==='medel'?' work':'')+'"><b>'+esc(r.l)+(r.lvl?' – '+esc(r.lvl):'')+'</b>'+bar+'<div class="small">'+esc(t)+'</div></div>'}).join('')+'</div>'}).join('');
}

/* ---------- Sammanställning ---------- */
function avg(v){return v==null?'–':Number(v).toFixed(1)}
function sumView(){

  rpc('fp3_list_fighters').then(function(a){$('sf').innerHTML=opts((a||[]).map(function(f){return[f.id,f.name]}),S.sumId,'Välj…');if(S.sumId)loadSum()}).catch(function(er){fail($('so'),er)});
  $('sf').onchange=function(){S.sumId=this.value;loadSum()};$('sd').onchange=function(){S.sumDays=+this.value;loadSum()};

function loadSum(){
  var o=$('so');if(!S.sumId){o.innerHTML='';return}o.innerHTML='<p class="muted">Laddar…</p>';
  rpc('fp2_fighter_summary',{p_fighter_id:S.sumId,p_days:S.sumDays}).then(function(s){
    var name=(s.fighter&&(s.fighter.name||s.fighter))||'',w=s.weeks||[],nc=s.notes||{},keys=Object.keys(nc),ss=s.sessions||[],p=s.pain||[];
    var h='<div class="card"><h2>'+esc(name)+' <span class="muted small">senaste '+esc(s.days)+' dagar · '+esc(s.checkins)+' incheckningar</span></h2>'+((s.flags||[]).length?s.flags.map(function(f){return '<span class="pill" style="color:var(--danger)">⚠ '+esc(f)+'</span>'}).join(''):'<span class="pill ok">Inga varningar</span>')+'</div>';
    if(w.length)h+='<div class="card"><h3 style="margin-top:0">Per vecka</h3><div style="overflow-x:auto"><table style="width:100%;font-size:.88rem;border-collapse:collapse"><tr><th align=left>Vecka</th><th>Inch.</th><th>RPE</th><th>Energi</th><th>Sömn</th><th>Humör</th></tr>'+w.map(function(x){return '<tr><td>'+esc(x.week)+'</td><td align=center>'+esc(x.n)+'</td><td align=center>'+avg(x.rpe)+'</td><td align=center>'+avg(x.energy)+'</td><td align=center>'+avg(x.sleep)+'</td><td align=center>'+avg(x.mood)+'</td></tr>'}).join('')+'</table></div></div>';
    if(p.length)h+='<div class="card"><h3 style="margin-top:0">Värk</h3>'+p.map(function(x){return '<div>'+esc(x.date)+' · '+esc(TN[x.type]||x.type)+' · '+esc(x.location||'ej angivet')+'</div>'}).join('')+'</div>';
    if(keys.length)h+='<div class="card"><h3 style="margin-top:0">Anteckningar per kategori</h3>'+keys.map(function(k){return '<h3>'+esc(CN[k]||k)+'</h3>'+nc[k].map(function(n){return '<div class="note"><q>'+esc(n.date)+(n.source==='allmän'?' · allmän':'')+'</q>'+esc(n.note)+'</div>'}).join('')}).join('')+'</div>';
    if(ss.length)h+='<div class="card"><h3 style="margin-top:0">Pass</h3>'+ss.map(function(x){var c=x.checkin;return '<div class="note"><b>'+esc(x.date)+' · '+esc(TN[x.type]||x.type)+'</b>'+(c?' <span class="small muted">RPE '+esc(c.rpe)+' · E '+esc(c.energy)+' · S '+esc(c.sleep)+' · H '+esc(c.mood)+(c.pain?' · värk'+(c.pain_location?' ('+esc(c.pain_location)+')':''):'')+'</span>':'')+(c&&c.went_well?'<div class="small">Funkade: '+esc(c.went_well)+'</div>':'')+(c&&c.work_on?'<div class="small">Jobba på: '+esc(c.work_on)+'</div>':'')+(x.notes||[]).map(function(n){return '<div class="small"><b>'+esc(CN[n.category]||n.category)+':</b> '+esc(n.note)+'</div>'}).join('')+'</div>'}).join('')+'</div>';
    h+='<div id="lay"></div><button class="btn sec" id="cpy">Kopiera som text</button>';o.innerHTML=h;
    rpc('fp3_fighter_layers',{p_fighter_id:S.sumId}).then(function(L){var e=$('lay');if(e)e.innerHTML=layersHtml(L)}).catch(function(){});
    $('cpy').onclick=function(){var t=name+' – senaste '+s.days+' dagar\n';(s.flags||[]).forEach(function(f){t+='! '+f+'\n'});t+='\nPer vecka:\n'+w.map(function(x){return x.week+': n='+x.n+' RPE '+avg(x.rpe)+' E '+avg(x.energy)+' S '+avg(x.sleep)+' H '+avg(x.mood)}).join('\n');keys.forEach(function(k){t+='\n\n'+(CN[k]||k)+':\n'+nc[k].map(function(n){return '- '+n.date+': '+n.note}).join('\n')});var b=$('cpy');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='Kopierad ✓'}).catch(function(){b.textContent='Kunde inte kopiera'})};
  }).catch(function(er){fail(o,er)});
}

function recoverForm(){
  app.innerHTML='<div class="card" style="max-width:380px;margin:28px auto"><h2>Sätt lösenord</h2><p class="small muted">Vi skickar en länk till din e-post. Öppna den på den här enheten.</p><label for="re">E-post</label><input id="re" type="email" autocomplete="username"><p id="rm" class="small"></p><button class="btn" id="rb" style="width:100%">Skicka länk</button><p class="small" style="margin-top:12px"><a href="#" id="rk">Tillbaka</a></p></div>';
  $('rk').onclick=function(e){e.preventDefault();login()};
  $('rb').onclick=function(){var em=$('re').value.trim();if(!em){fail($('rm'),new Error('Skriv e-post'));return}
    var back=location.origin+location.pathname;
    fetch(URL_+'/auth/v1/recover?redirect_to='+encodeURIComponent(back),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em})}).then(function(r){$('rm').className='small ok';$('rm').textContent='Om kontot finns har en länk skickats. Kolla din e-post.'}).catch(function(er){fail($('rm'),er)})};
}
function setPasswordForm(tok){
  tabs.hidden=true;
  app.innerHTML='<div class="card" style="max-width:380px;margin:28px auto"><h2>Välj nytt lösenord</h2><form id="sp"><label for="p1">Nytt lösenord (minst 8 tecken)</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required><label for="p2">Upprepa</label><input id="p2" type="password" autocomplete="new-password" required><p id="pm" class="small"></p><button class="btn" style="width:100%">Spara lösenord</button></form></div>';
  $('sp').onsubmit=function(e){e.preventDefault();if($('p1').value!==$('p2').value){fail($('pm'),new Error('Lösenorden är olika'));return}if($('p1').value.length<8){fail($('pm'),new Error('Minst 8 tecken'));return}
    fetch(URL_+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({password:$('p1').value})}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.msg||j.error_description||j.message||'Kunde inte spara');
      history.replaceState(null,'',location.pathname);$('pm').className='small ok';$('pm').textContent='Sparat. Du kan nu logga in.';setTimeout(function(){login()},1200)})}).catch(function(er){fail($('pm'),er)})};
}

var rt=ls('fp3_rt');
var hm=location.hash.match(/access_token=([^&]+)/),ht=/type=recovery/.test(location.hash);
if(hm&&ht){setPasswordForm(decodeURIComponent(hm[1]))}
else if(/error_description=/.test(location.hash)){login('Länken är ogiltig eller har gått ut. Begär en ny.')}
else if(rt){S.refresh=rt;boot().catch(function(){login()})}else login();
})();
</script>
